<div class="min-h-full flex flex-col space-y-3 sm:space-y-4 pb-12">
  <!-- Header Gọn Gàng -->
  <div class="bg-gradient-to-r from-slate-900 to-blue-950 rounded-2xl p-3.5 sm:p-5 text-white shadow-md shrink-0 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5">
    <div>
      <div class="flex items-center gap-1.5">
        <span class="px-2 py-0.5 bg-amber-500/20 text-amber-300 font-bold rounded text-[10px] sm:text-xs border border-amber-400/30">CỔNG NHÀ THẦU</span>
        <span class="px-2 py-0.5 bg-blue-500/20 text-blue-300 text-[10px] sm:text-xs rounded">Đối tác ngoài</span>
      </div>
      <h2 class="text-base sm:text-xl font-black text-white mt-1 flex items-center gap-1.5">
        <i class="fas fa-gavel text-amber-400 text-sm sm:text-base"></i> Sàn Tìm Việc & Nộp Báo Giá
      </h2>
      <p class="hidden sm:block text-xs text-slate-300 mt-0.5">Tìm kiếm công trình phù hợp, xem cấu hình hệ thống, BOM vật tư và nộp báo giá nhân công.</p>
    </div>
    <div class="bg-white/10 px-3 py-1.5 sm:py-2 rounded-xl backdrop-blur-sm border border-white/10 text-left sm:text-right w-full sm:w-auto flex sm:block justify-between items-center">
      <span class="text-[9px] sm:text-[10px] text-slate-300 uppercase font-bold">Đội Của Bạn:</span>
      <strong class="text-amber-300 text-xs sm:text-sm" id="my-team-name-disp">Đội Kỹ Thuật Solar Fast</strong>
    </div>
  </div>

  <!-- Filter & Search -->
  <div class="bg-white p-3 sm:p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-2.5 shrink-0">
    <div class="flex items-center gap-2 w-full sm:w-auto flex-1">
      <div class="relative flex-1">
        <i class="fas fa-search absolute left-3 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="cb-search" oninput="window.modContractorBidding.filter()" placeholder="🔍 Tìm công trình, khu vực, công suất..." class="w-full pl-8 pr-3 py-2 text-xs border rounded-xl outline-none focus:border-blue-500 font-medium bg-slate-50">
      </div>
      <select id="cb-filter-roof" onchange="window.modContractorBidding.filter()" class="text-xs border rounded-xl px-2.5 py-2 outline-none font-bold bg-slate-50 shrink-0">
        <option value="">Tất cả mái</option>
        <option value="Mái tôn">Mái tôn</option>
        <option value="Mái ngói">Mái ngói</option>
        <option value="Khung giàn">Khung giàn</option>
        <option value="Seamlock">Seamlock</option>
      </select>
    </div>
    <div class="text-xs font-bold text-slate-500 flex justify-between items-center sm:block">
      <span class="text-[11px] text-slate-400">Đang có:</span>
      <span class="text-blue-600 font-black"><span id="cb-count">0</span> công trình mở thầu</span>
    </div>
  </div>

  <!-- Cards Grid -->
  <div class="flex-1 pb-6">
    <div id="cb-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
      <!-- Render Cards -->
    </div>
  </div>
</div>

<!-- Modal / Bottom Sheet Nộp Báo Giá -->
<div id="modal-cb-bid" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-5 sm:p-6 shadow-2xl space-y-3.5 max-h-[90vh] overflow-y-auto">
    <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto sm:hidden mb-1"></div>
    <div class="flex justify-between items-center border-b pb-2.5">
      <div>
        <h3 class="text-sm sm:text-base font-black text-slate-900 flex items-center gap-2">
          <i class="fas fa-file-invoice-dollar text-emerald-600"></i> Nộp Báo Giá Thi Công
        </h3>
        <p class="text-xs text-slate-500 font-bold" id="cb-bid-project-title">DA-001</p>
      </div>
      <button onclick="window.modContractorBidding.closeModal()" class="w-8 h-8 rounded-full bg-slate-100 font-bold flex items-center justify-center text-slate-500 hover:text-slate-900 transition text-sm">&times;</button>
    </div>

    <form onsubmit="window.modContractorBidding.submitBid(event)" class="space-y-3 text-xs">
      <input type="hidden" id="cb-bid-pid">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Giá Nhân Công Đề Xuất (VNĐ) *</label>
          <input type="number" id="cb-labor-price" required placeholder="8500000" class="w-full px-3 py-2.5 border rounded-xl font-black text-emerald-600 outline-none text-base sm:text-sm">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Chi Phí Phát Sinh (Nếu có)</label>
          <input type="number" id="cb-extra-cost" value="0" class="w-full px-3 py-2.5 border rounded-xl font-bold outline-none text-base sm:text-sm">
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Số Thợ</label>
          <input type="number" id="cb-team-size" value="5" class="w-full px-2 py-2 border rounded-xl font-bold outline-none text-center">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Số Ngày</label>
          <input type="number" step="0.5" id="cb-days" value="2" class="w-full px-2 py-2 border rounded-xl font-bold outline-none text-center">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">BH (Tháng)</label>
          <input type="number" id="cb-warranty" value="24" class="w-full px-2 py-2 border rounded-xl font-bold outline-none text-center">
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">Ghi Chú Kỹ Thuật / Cam Kết</label>
        <textarea id="cb-notes" rows="2" placeholder="Cam kết đồ nghề đo kiểm, an toàn lao động, thi công thẩm mỹ..." class="w-full px-3 py-2 border rounded-xl outline-none text-xs"></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t">
        <button type="button" onclick="window.modContractorBidding.closeModal()" class="flex-1 sm:flex-initial px-4 py-2.5 bg-slate-100 font-bold rounded-xl text-slate-700">Hủy</button>
        <button type="submit" class="flex-1 sm:flex-initial px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md">Gửi Báo Giá</button>
      </div>
    </form>
  </div>
</div>

<script>
window.modContractorBidding = {
  projects: [],
  myTeamId: 1,
  myTeamName: "Đội Kỹ Thuật Solar Fast",

  init: async () => {
    try {
      const uStr = localStorage.getItem("sungo_user");
      if (uStr) {
        const u = JSON.parse(uStr);
        window.modContractorBidding.myTeamName = u.name || "Đội Kỹ Thuật Solar Fast";
        const el = document.getElementById("my-team-name-disp");
        if (el) el.innerText = window.modContractorBidding.myTeamName;
      }
    } catch(e) {}
    await window.modContractorBidding.load();
  },

  load: async () => {
    try {
      const res = await fetch("/api/bidding/projects?role=NHA_THAU_THI_CONG&t=" + Date.now());
      const json = await res.json();
      if (json.success) {
        window.modContractorBidding.projects = (json.data || []).filter(p => p.status === "BIDDING_OPEN" || p.status === "RECEIVING_BIDS");
        window.modContractorBidding.render();
      }
    } catch(e) {
      console.error(e);
    }
  },

  render: (list) => {
    const data = list || window.modContractorBidding.projects;
    const grid = document.getElementById("cb-grid");
    const countEl = document.getElementById("cb-count");
    if (countEl) countEl.innerText = data.length;

    if (!grid) return;
    if (data.length === 0) {
      grid.innerHTML = `<div class="col-span-3 p-12 text-center text-slate-400 font-bold bg-white rounded-2xl border border-slate-200">Hiện tại không có công trình nào đang mở thầu. Vui lòng quay lại sau!</div>`;
      return;
    }

    grid.innerHTML = data.map(p => {
      const formatPrice = (v) => v ? Number(v).toLocaleString("vi-VN") + " đ" : "---";
      return `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition p-5 flex flex-col justify-between space-y-4">
          <div class="space-y-3">
            <div class="flex justify-between items-start">
              <span class="px-2.5 py-1 bg-blue-50 text-blue-700 font-black rounded-lg text-xs font-mono">${p.project_code}</span>
              <span class="px-2.5 py-0.5 bg-purple-100 text-purple-800 text-[11px] font-bold rounded-full"><i class="fas fa-clock mr-1"></i> Hạn: ${p.bidding_deadline || "---"}</span>
            </div>

            <div>
              <h3 class="font-black text-slate-900 text-sm line-clamp-2">${p.project_name}</h3>
              <p class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                <i class="fas fa-map-marker-alt text-red-500"></i> ${p.province_city || "---"} ${p.district ? "• " + p.district : ""} ${p.distance_km ? "(" + p.distance_km + "km từ kho)" : ""}
              </p>
            </div>

            <!-- Cấu hình Solar -->
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 grid grid-cols-2 gap-2 text-xs">
              <div>
                <span class="text-slate-400 block text-[10px] uppercase font-bold">Công Suất / Hệ</span>
                <strong class="text-amber-600 font-black">${p.capacity_kwp} kWp</strong>
                <span class="text-slate-500 text-[11px]">(${p.system_type})</span>
              </div>
              <div>
                <span class="text-slate-400 block text-[10px] uppercase font-bold">Lưu Trữ / Kiểu Mái</span>
                <strong class="text-indigo-600 font-bold">${p.battery_kwh ? p.battery_kwh + " kWh" : "Không có"}</strong>
                <span class="text-slate-500 text-[11px] block truncate">${p.roof_type || "Mái tôn"}</span>
              </div>
            </div>

            <!-- Bảo mật thông tin -->
            <div class="bg-amber-50/60 border border-amber-200/60 p-2.5 rounded-xl text-xs text-amber-900 space-y-1">
              <div class="flex justify-between items-center font-bold">
                <span><i class="fas fa-user-secret mr-1 text-amber-600"></i> ${p.customer_name}</span>
                <span class="font-mono text-[11px]">${p.customer_phone}</span>
              </div>
              <p class="text-[10px] text-amber-700"><i class="fas fa-lock"></i> SĐT & Địa chỉ chính xác sẽ mở khóa khi bạn trúng thầu.</p>
            </div>
          </div>

          <!-- Footer & Nút nộp thầu -->
          <div class="border-t pt-3 flex items-center justify-between">
            <div>
              <span class="text-[10px] uppercase font-bold text-slate-400 block">Giá Trần Nhân Công</span>
              <strong class="text-emerald-700 font-black text-sm">${formatPrice(p.max_labor_budget)}</strong>
            </div>
            <button onclick="window.modContractorBidding.openModal(${p.id})" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center gap-1.5">
              <i class="fas fa-gavel"></i> Nộp Báo Giá
            </button>
          </div>
        </div>
      `;
    }).join("");
  },

  filter: () => {
    const term = (document.getElementById("cb-search").value || "").toLowerCase().trim();
    const roof = document.getElementById("cb-filter-roof").value;

    const filtered = window.modContractorBidding.projects.filter(p => {
      const matchTerm = (p.project_name || "").toLowerCase().includes(term) ||
                        (p.project_code || "").toLowerCase().includes(term) ||
                        (p.province_city || "").toLowerCase().includes(term);
      const matchRoof = !roof || (p.roof_type || "").includes(roof);
      return matchTerm && matchRoof;
    });
    window.modContractorBidding.render(filtered);
  },

  openModal: (projectId) => {
    const p = window.modContractorBidding.projects.find(x => x.id == projectId);
    if (!p) return;
    document.getElementById("cb-bid-pid").value = projectId;
    document.getElementById("cb-bid-project-title").innerText = `${p.project_code} - ${p.project_name}`;
    document.getElementById("cb-labor-price").value = p.max_labor_budget ? Math.round(p.max_labor_budget * 0.95) : 8000000;
    const modal = document.getElementById("modal-cb-bid");
    if (modal) modal.classList.remove("hidden");
  },

  closeModal: () => {
    const modal = document.getElementById("modal-cb-bid");
    if (modal) modal.classList.add("hidden");
  },

  submitBid: async (e) => {
    e.preventDefault();
    const pid = document.getElementById("cb-bid-pid").value;
    const payload = {
      team_id: window.modContractorBidding.myTeamId,
      team_name: window.modContractorBidding.myTeamName,
      labor_price: document.getElementById("cb-labor-price").value,
      extra_cost: document.getElementById("cb-extra-cost").value || 0,
      team_size: document.getElementById("cb-team-size").value,
      estimated_days: document.getElementById("cb-days").value,
      warranty_months: document.getElementById("cb-warranty").value,
      notes: document.getElementById("cb-notes").value.trim()
    };

    try {
      const res = await fetch(`/api/bidding/projects/${pid}/bids`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.success) {
        alert("🎉 Nộp báo giá đấu thầu thành công! Vui lòng chờ Chủ đầu tư / Admin phê duyệt.");
        window.modContractorBidding.closeModal();
      } else {
        alert("Lỗi: " + json.error);
      }
    } catch(err) {
      alert("Lỗi kết nối: " + err.message);
    }
  }
};

setTimeout(() => {
  window.modContractorBidding.init();
}, 50);
</script>
