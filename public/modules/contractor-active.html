<div class="h-full flex flex-col space-y-4 overflow-hidden">
  <div class="bg-gradient-to-r from-slate-900 to-indigo-950 rounded-2xl p-5 text-white shadow-lg shrink-0 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <span class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-300 font-bold rounded text-xs border border-emerald-400/30">CỔNG NHÀ THẦU THI CÔNG</span>
      <h2 class="text-xl font-black text-white mt-1 flex items-center gap-2">
        <i class="fas fa-hard-hat text-amber-400"></i> Công Trình Đang Thi Công (Đã Trúng Thầu)
      </h2>
      <p class="text-xs text-slate-300 mt-0.5">Thông tin khách hàng đã mở khóa toàn bộ. Hãy Check-in GPS khi đến nơi và chụp 6 ảnh hiện trường.</p>
    </div>
  </div>

  <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3 shrink-0">
    <div class="flex items-center gap-2">
      <label class="text-xs font-bold text-slate-600">Chọn Dự Án:</label>
      <select id="ca-proj-select" onchange="window.modContractorActive.onSelectProject(this.value)" class="text-xs border rounded-xl px-3 py-2 outline-none font-bold bg-slate-50 min-w-[280px]">
        <!-- Options -->
      </select>
    </div>
    <button onclick="window.modContractorActive.saveAll()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center gap-1.5">
      <i class="fas fa-save"></i> Lưu Toàn Bộ Hồ Sơ & Ảnh
    </button>
  </div>

  <div class="flex-1 overflow-y-auto pr-1">
    <div id="ca-content-area" class="space-y-5">
      <!-- Dynamic Active Project Content -->
    </div>
  </div>
</div>

<script>
window.modContractorActive = {
  projects: [],
  currentProject: null,
  myTeamId: 1,

  init: async () => {
    await window.modContractorActive.load();
  },

  load: async () => {
    try {
      const res = await fetch("/api/bidding/projects?role=NHA_THAU_THI_CONG&t=" + Date.now());
      const json = await res.json();
      if (json.success) {
        // Lọc các dự án đang thi công hoặc đã trúng thầu
        window.modContractorActive.projects = (json.data || []).filter(p => p.status === "TEAM_SELECTED" || p.status === "IN_PROGRESS" || p.status === "COMPLETED");
        window.modContractorActive.renderSelect();
      }
    } catch(e) { console.error(e); }
  },

  renderSelect: () => {
    const sel = document.getElementById("ca-proj-select");
    const list = window.modContractorActive.projects;
    if (!sel) return;

    if (list.length === 0) {
      sel.innerHTML = `<option value="">Chưa có công trình nào trúng thầu</option>`;
      document.getElementById("ca-content-area").innerHTML = `<div class="p-12 text-center text-slate-400 font-bold bg-white rounded-2xl border border-slate-200">Đội của bạn chưa có công trình nào trúng thầu đang chạy. Hãy vào mục "Sàn Tìm Việc & Báo Giá" để nộp thầu!</div>`;
      return;
    }

    sel.innerHTML = list.map(p => `<option value="${p.id}">${p.project_code} - ${p.project_name}</option>`).join("");
    window.modContractorActive.onSelectProject(list[0].id);
  },

  onSelectProject: async (id) => {
    const p = window.modContractorActive.projects.find(x => x.id == id);
    if (!p) return;
    window.modContractorActive.currentProject = p;

    let handover = {};
    try {
      const res = await fetch(`/api/bidding/handover/${id}?t=` + Date.now());
      const json = await res.json();
      if (json.success && json.data) handover = json.data;
    } catch(e) {}

    const checkin = p.checkin_data;
    const container = document.getElementById("ca-content-area");
    if (!container) return;

    container.innerHTML = `
      <!-- Thông tin Khách Hàng (Mở Khóa Toàn Bộ) -->
      <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-blue-950 text-white p-5 rounded-2xl shadow-md space-y-4">
        <div class="flex justify-between items-start border-b border-white/10 pb-3">
          <div>
            <span class="px-2.5 py-0.5 bg-emerald-500 text-white font-black text-xs rounded uppercase"><i class="fas fa-lock-open mr-1"></i> THÔNG TIN ĐÃ MỞ KHÓA TOÀN BỘ</span>
            <h3 class="text-lg font-black text-white mt-1">${p.project_name}</h3>
          </div>
          <span class="px-3 py-1 bg-amber-400/20 text-amber-300 font-bold text-xs rounded-lg font-mono">${p.project_code}</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
          <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm border border-white/10">
            <span class="text-slate-400 block uppercase font-bold text-[10px]">Chủ Đầu Tư</span>
            <strong class="text-white text-sm">${p.customer_name}</strong>
          </div>
          <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm border border-white/10">
            <span class="text-slate-400 block uppercase font-bold text-[10px]">Số Điện Thoại Liên Hệ</span>
            <a href="tel:${p.customer_phone}" class="text-emerald-400 font-black text-sm hover:underline block font-mono">📞 ${p.customer_phone}</a>
          </div>
          <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm border border-white/10 md:col-span-2">
            <span class="text-slate-400 block uppercase font-bold text-[10px]">Địa Chỉ Lắp Đặt Chính Xác</span>
            <p class="text-slate-200 font-bold mt-0.5">${p.address || (p.district + ", " + p.province_city)}</p>
          </div>
        </div>
      </div>

      <!-- Khối Check-in GPS & Tiến Độ -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- Check-in GPS -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex justify-between items-center">
            <h4 class="font-black text-slate-800 text-xs uppercase tracking-wider flex items-center gap-1.5">
              <i class="fas fa-map-marker-alt text-red-500"></i> 1. Check-in GPS Hiện Trường
            </h4>
            ${checkin ? `<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold text-xs">Đã Check-in</span>` : `<span class="px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-bold text-xs">Chưa Check-in</span>`}
          </div>

          ${checkin ? `
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
              <p>⏱️ Giờ đến: <strong>${new Date(checkin.timestamp).toLocaleString("vi-VN")}</strong></p>
              <p>📍 Tọa độ GPS: <strong class="font-mono text-blue-600">${checkin.gps}</strong></p>
              <p class="text-slate-600 italic">"${checkin.note}"</p>
            </div>
          ` : `
            <div class="space-y-2 text-xs">
              <div class="flex gap-2">
                <input type="text" id="ca-gps-val" placeholder="10.8031, 106.7329" class="flex-1 px-3 py-2 border rounded-xl font-mono text-xs outline-none">
                <button type="button" onclick="window.modContractorActive.getGPS()" class="px-3 py-2 bg-slate-100 font-bold rounded-xl text-xs hover:bg-slate-200">
                  <i class="fas fa-crosshairs"></i> Lấy GPS
                </button>
              </div>
              <input type="text" id="ca-gps-note" placeholder="Đội 5 thợ đã có mặt đầy đủ lúc 07:30..." class="w-full px-3 py-2 border rounded-xl text-xs outline-none">
              <button onclick="window.modContractorActive.submitCheckin(${p.id})" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow transition">
                <i class="fas fa-check-circle"></i> Bấm Check-in Hiện Trường
              </button>
            </div>
          `}
        </div>

        <!-- Cập nhật Tiến Độ % -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center">
              <h4 class="font-black text-slate-800 text-xs uppercase tracking-wider flex items-center gap-1.5">
                <i class="fas fa-sliders-h text-blue-600"></i> 2. Cập Nhật Tiến Độ Thi Công
              </h4>
              <span class="text-blue-600 font-black text-sm" id="ca-disp-prog">${p.progress}%</span>
            </div>
            <p class="text-xs text-slate-500 mt-1">Kéo thanh trượt để báo cáo tiến độ hoàn thành cho Giám Sát.</p>
          </div>
          <input type="range" min="0" max="100" value="${p.progress}" id="ca-range-prog" oninput="document.getElementById('ca-disp-prog').innerText = this.value + '%'" class="w-full accent-blue-600 h-2 bg-slate-200 rounded-lg cursor-pointer">
          <button onclick="window.modContractorActive.saveProgress(${p.id})" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow transition">
            Cập Nhật Tiến Độ
          </button>
        </div>
      </div>

      <!-- App Inverter Credentials Box -->
      <div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-5 rounded-2xl shadow-md space-y-4">
        <div class="flex items-center gap-2 border-b border-white/10 pb-2.5">
          <i class="fas fa-mobile-alt text-amber-400 text-lg"></i>
          <h4 class="font-bold text-amber-300 uppercase tracking-wider text-xs">3. Bàn Giao Tài Khoản App Inverter Cho Khách Hàng</h4>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Tên App</label>
            <input type="text" id="ca-app-name" value="${handover.app_name || "Solarman Smart"}" class="w-full bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-white font-bold outline-none">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Tài Khoản (Email / SĐT)</label>
            <input type="text" id="ca-app-acc" value="${handover.app_account || ""}" placeholder="khachhang@gmail.com" class="w-full bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-emerald-300 font-bold outline-none">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Mật Khẩu</label>
            <input type="text" id="ca-app-pass" value="${handover.app_password || "Sungo@123"}" class="w-full bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-amber-300 font-bold outline-none">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Trạng Thái Kết Nối Wifi</label>
            <select id="ca-app-status" class="w-full bg-slate-800 border border-white/20 rounded-xl px-3 py-2 text-emerald-300 font-bold outline-none">
              <option value="HOẠT ĐỘNG MƯỢT MÀ">✅ Online 100% (Mượt mà)</option>
              <option value="CHỜ CẤP MẠNG">⚠️ Đang chờ cấu hình Wifi</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Bộ 6 Ảnh Nghiệm Thu Hiện Trường -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <div>
            <h4 class="font-black text-slate-800 text-xs uppercase tracking-wider flex items-center gap-1.5">
              <i class="fas fa-camera text-amber-500"></i> 4. Chụp & Tải Lên 6 Ảnh Hiện Trường Nghiệm Thu
            </h4>
            <p class="text-xs text-slate-500 mt-0.5">Tiêu chuẩn kỹ thuật Solar để Giám Sát duyệt quyết toán tiền công.</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          ${window.modContractorActive.renderPhotoUpload("1. Tấm Pin Trên Mái", "ca-img-panels", handover.img_panels)}
          ${window.modContractorActive.renderPhotoUpload("2. Tủ Điện AC/DC", "ca-img-cabinet", handover.img_cabinet)}
          ${window.modContractorActive.renderPhotoUpload("3. Biến Tần Inverter", "ca-img-inverter", handover.img_inverter)}
          ${window.modContractorActive.renderPhotoUpload("4. Pin Lưu Trữ Lithium", "ca-img-battery", handover.img_battery)}
          ${window.modContractorActive.renderPhotoUpload("5. Đường Dây & Ống Bảo Vệ", "ca-img-wiring", handover.img_wiring)}
          ${window.modContractorActive.renderPhotoUpload("6. Màn Hình App Đủ Số Liệu", "ca-img-app", handover.img_app)}
        </div>
      </div>
    `;
  },

  renderPhotoUpload: (title, id, defaultSrc) => {
    return `
      <div class="border-2 border-dashed border-slate-200 hover:border-amber-500 rounded-2xl p-4 flex flex-col items-center justify-center text-center space-y-2 bg-slate-50">
        <span class="text-xs font-black text-slate-800">${title}</span>
        <img id="prev-${id}" src="${defaultSrc || ""}" class="${defaultSrc ? "" : "hidden"} w-full h-32 object-cover rounded-xl shadow-sm">
        <input type="file" accept="image/*" onchange="window.modContractorActive.handleUpload(event, 'prev-${id}', 'data-${id}')" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white cursor-pointer">
        <input type="hidden" id="data-${id}" value="${defaultSrc || ""}">
      </div>
    `;
  },

  handleUpload: (e, imgId, inputId) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const b64 = event.target.result;
      const img = document.getElementById(imgId);
      const inp = document.getElementById(inputId);
      if (img) { img.src = b64; img.classList.remove("hidden"); }
      if (inp) inp.value = b64;
    };
    reader.readAsDataURL(file);
  },

  getGPS: () => {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        const inp = document.getElementById("ca-gps-val");
        if (inp) inp.value = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
      });
    }
  },

  submitCheckin: async (pid) => {
    const gps = document.getElementById("ca-gps-val").value.trim() || "10.8031, 106.7329";
    const note = document.getElementById("ca-gps-note").value.trim() || "Đội thợ đã có mặt tại hiện trường.";

    try {
      const res = await fetch(`/api/bidding/projects/${pid}/checkin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ gps, note })
      });
      const json = await res.json();
      if (json.success) {
        alert("🎉 Check-in GPS thành công!");
        await window.modContractorActive.load();
      }
    } catch(e) { alert("Lỗi: " + e.message); }
  },

  saveProgress: async (pid) => {
    const progress = document.getElementById("ca-range-prog").value;
    try {
      const res = await fetch(`/api/bidding/projects/${pid}/progress`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ progress })
      });
      const json = await res.json();
      if (json.success) {
        alert("🎉 Đã cập nhật tiến độ " + progress + "%!");
      }
    } catch(e) { alert("Lỗi: " + e.message); }
  },

  saveAll: async () => {
    if (!window.modContractorActive.currentProject) return;
    const pid = window.modContractorActive.currentProject.id;
    const payload = {
      app_name: document.getElementById("ca-app-name").value.trim(),
      app_account: document.getElementById("ca-app-acc").value.trim(),
      app_password: document.getElementById("ca-app-pass").value.trim(),
      app_status: document.getElementById("ca-app-status").value,
      img_panels: document.getElementById("data-ca-img-panels").value,
      img_cabinet: document.getElementById("data-ca-img-cabinet").value,
      img_inverter: document.getElementById("data-ca-img-inverter").value,
      img_battery: document.getElementById("data-ca-img-battery").value,
      img_wiring: document.getElementById("data-ca-img-wiring").value,
      img_app: document.getElementById("data-ca-img-app").value,
      progress: document.getElementById("ca-range-prog").value
    };

    try {
      const res = await fetch(`/api/bidding/handover/${pid}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.success) {
        alert("🎉 Đã lưu toàn bộ hồ sơ 6 ảnh nghiệm thu và thông tin App Inverter!");
      }
    } catch(e) { alert("Lỗi: " + e.message); }
  }
};

setTimeout(() => {
  window.modContractorActive.init();
}, 50);
</script>
