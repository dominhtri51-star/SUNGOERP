<div id="bidding-submodule-container" class="min-min-h-full pb-12"></div>
<script>
(async () => {
    try {
        const res = await fetch("/modules/bidding-marketplace.html?t=" + Date.now());
        const html = await res.text();
        const container = document.getElementById("bidding-submodule-container");
        if (container) {
            container.innerHTML = html;
            const scripts = container.querySelectorAll("script");
            scripts.forEach(s => {
                const newScript = document.createElement("script");
                newScript.textContent = s.textContent;
                document.body.appendChild(newScript);
            });
            setTimeout(() => {
                if (window.modBidding && window.modBidding.switchTab) {
                    window.modBidding.switchTab("tab-settlement");
                }
            }, 100);
        }
    } catch(e) {
        console.error("Lỗi nạp sub-module:", e);
    }
})();
</script>
