<div class="h-full flex flex-col space-y-4 overflow-hidden">
  <div class="bg-gradient-to-r from-slate-900 to-indigo-950 rounded-2xl p-5 text-white shadow-lg shrink-0">
    <span class="px-2.5 py-0.5 bg-purple-500/20 text-purple-300 font-bold rounded text-xs border border-purple-400/30">CỔNG NHÀ THẦU GIÁM SÁT</span>
    <h2 class="text-xl font-black text-white mt-1 flex items-center gap-2">
      <i class="fas fa-clipboard-check text-amber-400"></i> Giám Sát Hiện Trường & Radar Check-in GPS
    </h2>
    <p class="text-xs text-slate-300 mt-0.5">Theo dõi lịch trình các đội thợ đến hiện trường, kiểm tra tọa độ GPS và tiến độ lắp đặt.</p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex-1 overflow-hidden flex flex-col">
    <div class="p-4 border-b flex justify-between items-center">
      <h3 class="text-sm font-black text-slate-800 uppercase tracking-wider">Danh Sách Công Trình Đang Thi Công</h3>
    </div>
    <div class="overflow-y-auto flex-1">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-100 font-black text-slate-600 uppercase border-b">
          <tr>
            <th class="p-3.5">Mã & Công Trình</th>
            <th class="p-3.5">Đội Thợ Phụ Trách</th>
            <th class="p-3.5">Check-in GPS Hiện Trường</th>
            <th class="p-3.5 text-center">Tiến Độ</th>
            <th class="p-3.5 text-center">Trạng Thái</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100" id="sup-proj-tbody">
          <!-- Render Rows -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(() => {
  fetch("/api/bidding/projects?role=NHA_THAU_GIAM_SAT&t=" + Date.now())
    .then(r => r.json())
    .then(json => {
      if (!json.success) return;
      const tbody = document.getElementById("sup-proj-tbody");
      if (!tbody) return;
      tbody.innerHTML = (json.data || []).map(p => {
        const cin = p.checkin_data;
        return `
          <tr class="hover:bg-blue-50/30 transition">
            <td class="p-3.5">
              <span class="px-2 py-0.5 bg-blue-50 text-blue-700 font-mono font-bold rounded">${p.project_code}</span>
              <strong class="text-slate-800 block mt-1">${p.project_name}</strong>
              <p class="text-slate-400 text-[11px]">${p.district || ""}, ${p.province_city || ""}</p>
            </td>
            <td class="p-3.5">
              <strong class="text-slate-900">${p.winning_team_name || "Chưa gán"}</strong>
            </td>
            <td class="p-3.5">
              ${cin ? `
                <div class="text-[11px] space-y-0.5">
                  <span class="text-emerald-700 font-bold font-mono">📍 ${cin.gps}</span>
                  <p class="text-slate-500">${new Date(cin.timestamp).toLocaleTimeString("vi-VN")}</p>
                </div>
              ` : `<span class="text-amber-600 italic">Chưa check-in</span>`}
            </td>
            <td class="p-3.5 text-center">
              <span class="font-black text-blue-600">${p.progress}%</span>
            </td>
            <td class="p-3.5 text-center">
              <span class="px-2.5 py-1 rounded-full font-bold ${p.status === "COMPLETED" ? "bg-emerald-100 text-emerald-800" : "bg-blue-100 text-blue-800"}">${p.status}</span>
            </td>
          </tr>
        `;
      }).join("");
    });
})();
</script>
