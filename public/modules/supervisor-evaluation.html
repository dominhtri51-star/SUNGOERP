<div class="min-h-full flex flex-col space-y-4 pb-12">
  <div class="bg-gradient-to-r from-slate-900 to-indigo-950 rounded-2xl p-5 text-white shadow-lg shrink-0">
    <span class="px-2.5 py-0.5 bg-purple-500/20 text-purple-300 font-bold rounded text-xs border border-purple-400/30">CỔNG NHÀ THẦU GIÁM SÁT</span>
    <h2 class="text-xl font-black text-white mt-1 flex items-center gap-2">
      <i class="fas fa-star text-amber-400"></i> Chấm Điểm & Đánh Giá Đội Thợ (1-5 Sao ★)
    </h2>
    <p class="text-xs text-slate-300 mt-0.5">Đánh giá 4 tiêu chí cốt lõi để Admin phê duyệt quyết toán tài chính.</p>
  </div>

  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex-1 overflow-y-auto max-w-xl">
    <form onsubmit="window.modSupEval.submit(event)" class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-slate-700 mb-1">Chọn Dự Án Để Đánh Giá *</label>
        <select id="se-pid" required class="w-full px-3 py-2 border rounded-xl font-bold bg-slate-50 outline-none">
          <!-- Options -->
        </select>
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Xếp Hạng Tổng Thể</label>
        <select id="se-stars" class="w-full px-3 py-2 border rounded-xl font-black text-amber-500 bg-white outline-none">
          <option value="5">⭐⭐⭐⭐⭐ 5.0 Sao (Xuất sắc)</option>
          <option value="4">⭐⭐⭐⭐ 4.0 Sao (Tốt)</option>
          <option value="3">⭐⭐⭐ 3.0 Sao (Đạt)</option>
          <option value="2">⭐⭐ 2.0 Sao (Cần khắc phục)</option>
          <option value="1">⭐ 1.0 Sao (Kém)</option>
        </select>
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Nhận Xét Kỹ Thuật Nghiệm Thu Của Giám Sát *</label>
        <textarea id="se-comment" required rows="3" placeholder="Đội thi công đúng sơ đồ nguyên lý, kiểm tra tiếp địa < 4 Ohm, bọc chống cháy cẩn thận..." class="w-full px-3 py-2 border rounded-xl outline-none"></textarea>
      </div>
      <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 text-white font-black rounded-xl shadow-md transition">
        Lưu Đánh Giá & Phê Duyệt Nghiệm Thu
      </button>
    </form>
  </div>
</div>

<script>
window.modSupEval = {
  init: async () => {
    const res = await fetch("/api/bidding/projects?role=NHA_THAU_GIAM_SAT&t=" + Date.now());
    const json = await res.json();
    if (json.success) {
      const sel = document.getElementById("se-pid");
      if (sel) {
        sel.innerHTML = (json.data || []).map(p => `<option value="${p.id}">${p.project_code} - ${p.project_name} (${p.winning_team_name || "Chưa có đội"})</option>`).join("");
      }
    }
  },
  submit: async (e) => {
    e.preventDefault();
    const pid = document.getElementById("se-pid").value;
    const stars = document.getElementById("se-stars").value;
    const comment = document.getElementById("se-comment").value.trim();

    try {
      const res = await fetch(`/api/bidding/projects/${pid}/evaluate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rating_stars: stars, comment, reviewer: "Đơn Vị Giám Sát EPC Pro" })
      });
      const json = await res.json();
      if (json.success) {
        alert("🎉 Đã lưu đánh giá thành công! Điểm uy tín đội thợ đã được cập nhật.");
      }
    } catch(err) { alert("Lỗi: " + err.message); }
  }
};
setTimeout(() => { window.modSupEval.init(); }, 50);
</script>
