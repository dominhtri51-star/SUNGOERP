<div class="p-6 min-h-full flex flex-col bg-slate-50 relative text-sm pb-12">
    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-6 shrink-0">
        <div>
            <h2 class="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2.5">
                <i class="fas fa-user-shield text-blue-600"></i> Quản Lý Tài Khoản & Phân Quyền (RBAC)
            </h2>
            <p class="text-xs text-slate-500 font-medium mt-0.5">Quản lý danh sách tài khoản, vai trò và phân quyền module truy cập cho nhân sự</p>
        </div>
        <div class="flex items-center gap-2.5">
            <button onclick="window.modUsers.goToSettingsPermissions()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-4 py-2.5 rounded-xl font-black text-xs shadow-md transition flex items-center gap-1.5 cursor-pointer uppercase">
                <i class="fas fa-sliders-h"></i> Cấu Hình Phân Quyền Module
            </button>
            <button onclick="window.modUsers.openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-black text-xs shadow-lg shadow-blue-500/20 transition flex items-center gap-1.5 cursor-pointer uppercase">
                <i class="fas fa-user-plus"></i> Tạo Tài Khoản Mới
            </button>
        </div>
    </div>

    <!-- Bảng danh sách User -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden flex-1">
        <div class="overflow-x-auto">
            <table class="w-full text-left whitespace-nowrap">
                <thead class="bg-[#f8f9fa] text-slate-500 text-[10px] uppercase font-bold border-b border-slate-100">
                    <tr>
                        <th class="p-4 py-3.5">Mã NV (KPI)</th>
                        <th class="p-4 py-3.5">Tài khoản (Username)</th>
                        <th class="p-4 py-3.5">Họ Tên Nhân Viên</th>
                        <th class="p-4 py-3.5">Quyền Vai Trò (Role)</th>
                        <th class="p-4 py-3.5">Quyền Cấp Riêng</th>
                        <th class="p-4 py-3.5 text-center">Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="users-tbody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Tạo / Sửa User -->
    <div id="user-modal" class="fixed inset-0 bg-slate-900/60 z-[100] hidden items-center justify-center backdrop-blur-xs transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-transform border border-slate-100">
            <div class="bg-slate-900 p-5 flex items-center justify-between border-b border-slate-800">
                <h3 class="text-white font-black uppercase text-sm flex items-center gap-2">
                    <i class="fas fa-user-shield text-amber-500"></i> Cấp / Sửa Tài Khoản Nhân Viên
                </h3>
                <button onclick="window.modUsers.closeModal()" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <!-- Thêm input ẩn để lưu ID khi Edit -->
                <input type="hidden" id="usr-id" value="">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Mã NV (KPI ID)</label>
                        <input type="text" id="usr-empid" placeholder="VD: SALE_01" class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:border-blue-500 text-sm font-bold bg-amber-50/60">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Tên đăng nhập</label>
                        <input type="text" id="usr-username" placeholder="VD: namkho" class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:border-blue-500 text-sm font-bold">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Họ tên nhân viên</label>
                    <input type="text" id="usr-fullname" placeholder="Nguyễn Văn A" class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:border-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Mật khẩu</label>
                    <input type="password" id="usr-password" placeholder="******" class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:border-blue-500 text-sm font-bold">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1 text-red-500">Giới hạn chức năng phòng ban (Role)</label>
                    <select id="usr-role" class="w-full border-2 border-blue-200 bg-blue-50/80 text-blue-900 rounded-xl p-3 text-xs font-black outline-none focus:border-blue-500">
                        <option value="ADMIN">👑 GIÁM ĐỐC (FULL QUYỀN)</option>
                        <option value="SALE_ADMIN">🌟 TRƯỞNG PHÒNG SALE (Duyệt giá, Xem kho, Sàn đấu thầu)</option>
                        <option value="SALE">🤝 SALE & MARKETING (Xem giá, Tạo BOQ/Đơn hàng)</option>
                        <option value="THU_MUA">🛒 THU MUA (Tồn kho, Nhà cung cấp)</option>
                        <option value="NHAN_VIEN_KHO" class="text-red-600 bg-red-50">📦 KHO VẬN (MÙ GIÁ - Chỉ Xuất/Nhập/Đóng gói)</option>
                        <option value="KE_TOAN">💰 KẾ TOÁN (Sổ quỹ, VAT, Hợp đồng, Lương, CFO)</option>
                        <option value="KY_THUAT">🔧 KỸ THUẬT & O&M (Serial, Dự án, Thi công)</option>
                        <option value="HR">👥 QUẢN LÝ NHÂN SỰ (Bảng lương & Chấm công)</option>
                        <option value="NHA_THAU_THI_CONG">🏗️ NHÀ THẦU THI CÔNG</option>
                        <option value="NHA_THAU_GIAM_SAT">🔍 ĐƠN VỊ GIÁM SÁT</option>
                        <option value="NHA_CUNG_CAP">🏭 NHÀ CUNG CẤP</option>
                    </select>
                </div>
                <button onclick="window.modUsers.saveUser()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-black py-3.5 rounded-xl mt-2 shadow-lg shadow-blue-500/25 transition uppercase text-xs cursor-pointer">
                    Xác Nhận Lưu Tài Khoản
                </button>
            </div>
        </div>
    </div>
</div>

<script>
window.modUsers = {
    usersData: [], 
    load: async () => {
        const tbody = document.getElementById('users-tbody');
        tbody.innerHTML = '<tr><td colspan="6" class="p-10 text-center"><i class="fas fa-spinner fa-spin text-2xl text-slate-400"></i></td></tr>';
        try {
            const res = await fetch('/api/users?t=' + Date.now());
            const data = await res.json();
            
            if(data.success) {
                window.modUsers.usersData = data.data; 
                const currentUserStr = localStorage.getItem('sungo_user');
                const currentUser = currentUserStr ? JSON.parse(currentUserStr) : { role: 'GUEST' };
                const myRole = currentUser.role;

                tbody.innerHTML = data.data.map(u => {
                    let rBadge = '';
                    switch(u.role) {
                        case 'SUPER_ADMIN': rBadge = '<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-full font-black text-[10px] border border-red-300">👑 TỐI CAO</span>'; break;
                        case 'ADMIN': rBadge = '<span class="bg-purple-100 text-purple-700 px-2.5 py-1 rounded-full font-black text-[10px]">💼 GIÁM ĐỐC</span>'; break;
                        case 'SALE_ADMIN': rBadge = '<span class="bg-amber-100 text-amber-900 px-2.5 py-1 rounded-full font-black text-[10px] border border-amber-300">🌟 TRƯỞNG PHÒNG SALE</span>'; break;
                        case 'NHAN_VIEN_KHO': rBadge = '<span class="bg-orange-100 text-orange-700 px-2.5 py-1 rounded-full font-black text-[10px] border border-orange-200">📦 KHO VẬN (MÙ GIÁ)</span>'; break;
                        case 'SALE': rBadge = '<span class="bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full font-black text-[10px]">🤝 KINH DOANH</span>'; break;
                        case 'KY_THUAT': 
                        case 'BAO_HANH': rBadge = '<span class="bg-cyan-100 text-cyan-700 px-2.5 py-1 rounded-full font-black text-[10px]">🔧 KỸ THUẬT O&M</span>'; break;
                        case 'KE_TOAN': rBadge = '<span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full font-black text-[10px]">💰 KẾ TOÁN</span>'; break;
                        case 'THU_MUA': rBadge = '<span class="bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-black text-[10px]">🛒 THU MUA</span>'; break;
                        case 'HR': rBadge = '<span class="bg-pink-100 text-pink-700 px-2.5 py-1 rounded-full font-black text-[10px]">👥 NHÂN SỰ</span>'; break;
                        default: rBadge = `<span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full font-black text-[10px]">${u.role}</span>`;
                    }

                    // Custom permissions badge
                    const customMods = Array.isArray(u.custom_modules) ? u.custom_modules : [];
                    let customBadge = '';
                    if (u.role === 'ADMIN' || u.role === 'SUPER_ADMIN') {
                        customBadge = '<span class="text-slate-400 text-xs font-medium">Toàn quyền hệ thống</span>';
                    } else if (customMods.length > 0) {
                        customBadge = `
                            <span class="inline-flex items-center gap-1 bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-black text-[10px] border border-emerald-300">
                                <i class="fas fa-plus text-[8px]"></i> ${customMods.length} module riêng
                            </span>
                        `;
                    } else {
                        customBadge = '<span class="text-slate-400 text-xs">Theo vai trò</span>';
                    }

                    // Action buttons
                    let actionButtons = '';
                    const isSelf = (currentUser && (currentUser.id === u.id || currentUser.empId === u.emp_id || currentUser.name === u.full_name));

                    if (u.role === 'SUPER_ADMIN' && myRole !== 'SUPER_ADMIN') {
                        actionButtons = `<span class="text-[10px] text-red-400 font-bold uppercase"><i class="fas fa-lock mr-1"></i> Bất khả xâm phạm</span>`;
                    } else if (u.role === 'ADMIN' && myRole !== 'SUPER_ADMIN' && myRole !== 'ADMIN') {
                        actionButtons = `<span class="text-xs text-slate-400"><i class="fas fa-shield-alt mr-1"></i>Bảo vệ</span>`;
                    } else {
                        actionButtons = `
                            <button onclick="window.modUsers.goToSettingsPermissions(${u.id})" class="text-emerald-600 hover:text-emerald-800 font-bold text-xs mr-3 transition cursor-pointer" title="Cấp quyền riêng cho nhân viên này"><i class="fas fa-key"></i> Phân Quyền</button>
                            <button onclick="window.modUsers.editUser(${u.id})" class="text-blue-500 hover:text-blue-700 font-bold text-xs mr-3 transition cursor-pointer" title="Sửa thông tin hoặc đổi mật khẩu"><i class="fas fa-edit"></i> Đổi Pass / Sửa</button>
                            <button onclick="window.modUsers.deleteUser(${u.id}, '${u.username}')" class="text-red-400 hover:text-red-600 font-bold text-xs transition cursor-pointer" title="Xóa tài khoản"><i class="fas fa-trash"></i> Xóa</button>
                        `;
                    }

                    return `
                    <tr class="hover:bg-slate-50 transition border-b border-slate-50">
                        <td class="p-4 py-3 font-black text-amber-600 text-[13px] bg-amber-50/30">${u.emp_id || 'N/A'}</td>
                        <td class="p-4 py-3 font-bold text-blue-600 text-[13px]">${u.username} ${isSelf ? '<span class="text-[9px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-normal ml-1">Đang đăng nhập</span>' : ''}</td>
                        <td class="p-4 py-3 font-bold text-slate-700">${u.full_name}</td>
                        <td class="p-4 py-3">${rBadge}</td>
                        <td class="p-4 py-3">${customBadge}</td>
                        <td class="p-4 py-3 text-center">${actionButtons}</td>
                    </tr>`;
                }).join('');
            } else {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500 font-bold">Lỗi từ Database: ${data.error}</td></tr>`;
            }
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-500 font-bold">Lỗi kết nối tới Server. API chưa phản hồi.</td></tr>';
        }
    },

    goToSettingsPermissions: (userId) => {
        if (typeof window.loadModule === 'function') {
            window.loadModule('settings', 'Cài Đặt Hệ Thống & Phân Quyền');
            setTimeout(() => {
                if (window.modSettings) {
                    window.modSettings.switchTab('permissions');
                    if (userId) {
                        window.modSettings.switchPermSubTab('user');
                        setTimeout(() => {
                            window.modSettings.selectUserForPerm(userId);
                        }, 100);
                    }
                }
            }, 300);
        }
    },

    openModal: () => {
        document.getElementById('usr-id').value = '';
        document.getElementById('usr-empid').value = '';
        document.getElementById('usr-username').value = '';
        document.getElementById('usr-password').value = '';
        document.getElementById('usr-fullname').value = '';
        document.getElementById('usr-password').placeholder = 'Nhập mật khẩu (bắt buộc khi tạo mới)';
        
        const m = document.getElementById('user-modal');
        m.classList.remove('hidden'); m.classList.add('flex');
    },

    editUser: (id) => {
        const user = window.modUsers.usersData.find(u => u.id === id);
        if(!user) return;
        
        document.getElementById('usr-id').value = user.id;
        document.getElementById('usr-empid').value = user.emp_id || '';
        document.getElementById('usr-username').value = user.username;
        document.getElementById('usr-fullname').value = user.full_name;
        document.getElementById('usr-role').value = user.role;
        
        document.getElementById('usr-password').value = '';
        document.getElementById('usr-password').placeholder = 'Nhập mật khẩu mới (để trống nếu giữ nguyên)';
        
        const m = document.getElementById('user-modal');
        m.classList.remove('hidden'); m.classList.add('flex');
    },

    closeModal: () => {
        const m = document.getElementById('user-modal');
        m.classList.add('hidden'); m.classList.remove('flex');
    },

    saveUser: async () => {
        const id = document.getElementById('usr-id').value;
        const payload = {
            emp_id: document.getElementById('usr-empid').value,
            username: document.getElementById('usr-username').value,
            full_name: document.getElementById('usr-fullname').value,
            role: document.getElementById('usr-role').value
        };
        
        const password = document.getElementById('usr-password').value;
        if(password) payload.password = password;
        
        if(!payload.emp_id) return alert("❌ Bắt buộc phải nhập Mã Nhân Viên (Phục vụ KPI)!");
        if(!id && !payload.password) return alert("❌ Tạo mới phải nhập Password!");
        if(!payload.username) return alert("❌ Bắt buộc nhập Username!");
        
        const method = id ? 'PUT' : 'POST';
        const url = id ? '/api/users/' + id : '/api/users';

        try {
            const res = await fetch(url, { 
                method: method, 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(payload) 
            });
            const data = await res.json();
            if(data.success) {
                alert(id ? "✅ Cập nhật tài khoản & mật khẩu thành công!" : "✅ Tạo tài khoản mới thành công!");
                window.modUsers.closeModal();
                window.modUsers.load();
                
                // Nếu đang sửa chính tài khoản đang đăng nhập, cập nhật lại localStorage
                const curUserStr = localStorage.getItem('sungo_user');
                if (curUserStr && id) {
                    const curUser = JSON.parse(curUserStr);
                    if (String(curUser.id) === String(id)) {
                        curUser.name = payload.full_name;
                        curUser.empId = payload.emp_id;
                        curUser.role = payload.role;
                        localStorage.setItem('sungo_user', JSON.stringify(curUser));
                    }
                }
            } else alert("❌ " + (data.error || 'Lỗi lưu tài khoản!'));
        } catch(e) { alert("❌ Lỗi kết nối máy chủ khi lưu tài khoản!"); }
    },

    deleteUser: async (id, name) => {
        const curUserStr = localStorage.getItem('sungo_user');
        if (curUserStr) {
            const curUser = JSON.parse(curUserStr);
            if (String(curUser.id) === String(id) || curUser.username === name) {
                return alert("❌ Bạn không thể tự xóa tài khoản đang đăng nhập hiện tại!");
            }
        }

        const confirmMsg = `Bạn có chắc chắn muốn xóa vĩnh viễn tài khoản "${name}" khỏi hệ thống không?`;
        if (!confirm(confirmMsg)) return;

        try {
            const res = await fetch('/api/users/' + id, { method: 'DELETE' });
            const data = await res.json();
            if(res.ok && data.success) {
                alert("✅ Đã xóa tài khoản thành công!");
                window.modUsers.load();
            } else {
                alert("❌ Lỗi khi xóa từ server: " + (data.error || 'Không thể xóa'));
            }
        } catch(e) { 
            alert("❌ Lỗi kết nối khi xóa tài khoản!"); 
        }
    }
};

window.modUsers.load();
</script>
