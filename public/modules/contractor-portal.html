<div class="w-full min-h-full flex flex-col space-y-4 font-sans pb-28 md:pb-6">
  
  <!-- Header Banner -->
  <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-blue-950 rounded-2xl p-4 sm:p-5 text-white shadow-2xs shrink-0 flex flex-col md:flex-row justify-between items-start md:items-center gap-3.5">
    <div>
      <div class="flex items-center gap-2">
        <span class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-300 font-bold rounded-full text-[10px] border border-emerald-400/30">CỔNG NHÀ THẦU</span>
        <span class="px-2.5 py-0.5 bg-blue-500/20 text-blue-300 text-[10px] font-bold rounded-full" id="cp-team-badge">Đội Kỹ Thuật Solar Fast</span>
      </div>
      <h1 class="text-base sm:text-xl font-black text-white mt-1 flex items-center gap-2">
        <i class="fas fa-clipboard-check text-amber-400"></i> Quản Trị Dự Án & Hồ Sơ Nghiệm Thu Hiện Trường
      </h1>
      <p class="text-xs text-slate-300 mt-0.5">Xem dự án chỉ định, Check-in GPS, cập nhật tiến độ, tải 6 ảnh nghiệm thu & biên bản bàn giao.</p>
    </div>

    <div class="flex items-center gap-2 w-full md:w-auto">
      <button onclick="window.modContractorPortal.saveAllHandover()" class="flex-1 md:flex-initial px-4 py-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold rounded-xl text-xs shadow-2xs transition flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap">
        <i class="fas fa-save"></i> Lưu Hồ Sơ & Tư Liệu
      </button>
    </div>
  </div>

  <!-- Chọn Dự Án Được Giao -->
  <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-2xs flex flex-col md:flex-row justify-between items-start md:items-center gap-3 shrink-0">
    <div class="flex flex-col sm:flex-row sm:items-center gap-2 w-full md:w-auto">
      <label class="text-xs font-bold text-slate-700 whitespace-nowrap"><i class="fas fa-tasks text-blue-600 mr-1"></i> Chọn Dự Án Chỉ Định:</label>
      <select id="cp-project-select" onchange="window.modContractorPortal.onSelectProject(this.value)" class="text-xs border border-slate-200 rounded-xl px-3 py-2 outline-none font-bold bg-slate-50 text-slate-800 flex-1 md:min-w-[320px]">
        <!-- Options -->
      </select>
    </div>
    <div class="flex items-center gap-3 text-xs" id="cp-project-status-bar">
      <!-- Status pill -->
    </div>
  </div>

  <!-- Main Scrollable Workspace -->
  <div id="cp-content-area" class="space-y-4 pb-8">
    <!-- Dynamic Project Workspace -->
  </div>

</div>

<!-- Modal: Thêm Tư Liệu Nghiệm Thu Bổ Sung -->
<div id="modal-cp-add-doc" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="text-sm font-black text-slate-900 flex items-center gap-1.5">
        <i class="fas fa-file-upload text-blue-600"></i> Thêm Tư Liệu / Biên Bản Nghiệm Thu
      </h3>
      <button onclick="window.modContractorPortal.closeAddDocModal()" class="w-7 h-7 rounded-full bg-slate-100 font-bold flex items-center justify-center text-sm">&times;</button>
    </div>
    <form onsubmit="window.modContractorPortal.submitAddDoc(event)" class="space-y-3 text-xs">
      <div>
        <label class="block font-bold text-slate-700 mb-1">Tên Tư Liệu / Biên Bản *</label>
        <input type="text" id="doc-name" required placeholder="VD: Biên bản đo điện trở tiếp địa < 4 Ohm" class="w-full px-3 py-2 border rounded-xl outline-none">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Đường Dẫn File / Ảnh Tư Liệu</label>
        <input type="text" id="doc-url" placeholder="https://... hoặc tải ảnh bên dưới" class="w-full px-3 py-2 border rounded-xl outline-none font-mono">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Tải Ảnh / File Trực Tiếp</label>
        <input type="file" accept="image/*,.pdf,.doc,.docx" onchange="window.modContractorPortal.handleDocFileUpload(event)" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Ghi Chú Kỹ Thuật</label>
        <textarea id="doc-notes" rows="2" placeholder="Đo thực tế Fluke 1625 đạt 2.8 Ohm, thời tiết khô ráo..." class="w-full px-3 py-2 border rounded-xl outline-none"></textarea>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t">
        <button type="button" onclick="window.modContractorPortal.closeAddDocModal()" class="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl">Hủy</button>
        <button type="submit" class="px-5 py-2 bg-blue-600 text-white font-bold rounded-xl shadow">Lưu Tư Liệu</button>
      </div>
    </form>
  </div>
</div>

<script>
window.modContractorPortal = {
  projects: [],
  currentProject: null,
  myTeamId: 1, // Default team 1

  init: async () => {
    try {
      const uStr = localStorage.getItem("user");
      if (uStr) {
        const u = JSON.parse(uStr);
        window.modContractorPortal.currentUser = u;
        if (u.username === 'thauthicong' || u.role === 'NHA_THAU_THI_CONG') {
          window.modContractorPortal.myTeamId = 1;
        } else if (u.username === 'thaugiamsat' || u.role === 'NHA_THAU_GIAM_SAT') {
          window.modContractorPortal.myTeamId = 2;
        } else if (u.username === 'nhacungcap' || u.role === 'NHA_CUNG_CAP') {
          window.modContractorPortal.myTeamId = 3;
        }
        const badge = document.getElementById("cp-team-badge");
        if (badge) badge.innerText = u.full_name || ("Đội thầu: " + u.username);
      }
    } catch(e) {}
    await window.modContractorPortal.loadMyProjects();
  },

  loadMyProjects: async () => {
    try {
      const res = await fetch(`/api/bidding/my-projects?team_id=${window.modContractorPortal.myTeamId}&t=` + Date.now());
      const json = await res.json();
      if (json.success) {
        window.modContractorPortal.projects = json.data || [];
        window.modContractorPortal.renderSelect();
      }
    } catch(e) { console.error(e); }
  },

  renderSelect: () => {
    const sel = document.getElementById("cp-project-select");
    const list = window.modContractorPortal.projects;
    if (!sel) return;

    if (list.length === 0) {
      sel.innerHTML = `<option value="">Chưa có dự án nào được chỉ định</option>`;
      document.getElementById("cp-content-area").innerHTML = `
        <div class="p-12 text-center text-slate-400 font-bold bg-white rounded-2xl border border-slate-200">
          <i class="fas fa-inbox text-4xl text-slate-300 mb-2 block"></i>
          Hiện tại đội của bạn chưa có công trình nào được công ty chỉ định thi công.
        </div>
      `;
      return;
    }

    sel.innerHTML = list.map(p => `<option value="${p.id}">${p.project_code} - ${p.project_name} (${p.status})</option>`).join("");
    window.modContractorPortal.onSelectProject(list[0].id);
  },

  onSelectProject: (id) => {
    const p = window.modContractorPortal.projects.find(x => x.id == id);
    if (!p) return;
    window.modContractorPortal.currentProject = p;

    const checkin = p.checkin_data;
    const handover = p.handover_data || {};
    const docs = p.acceptance_documents || [];
    const container = document.getElementById("cp-content-area");
    if (!container) return;

    const formatPrice = (v) => v ? Number(v).toLocaleString("vi-VN") + " đ" : "---";

    container.innerHTML = `
      <!-- Khối Thông Tin Công Trình & Khách Hàng -->
      <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-blue-950 text-white p-5 rounded-2xl shadow-md space-y-4">
        <div class="flex justify-between items-start border-b border-white/10 pb-3">
          <div>
            <span class="px-2.5 py-0.5 bg-emerald-500 text-white font-black text-xs rounded uppercase">
              <i class="fas fa-check-circle mr-1"></i> DỰ ÁN ĐÃ ĐƯỢC CHỈ ĐỊNH CHO ĐỘI CỦA BẠN
            </span>
            <h2 class="text-lg font-black text-white mt-1">${p.project_name}</h2>
          </div>
          <div class="text-right">
            <span class="px-3 py-1 bg-amber-400/20 text-amber-300 font-bold text-xs rounded-lg font-mono">${p.project_code}</span>
            <span class="text-emerald-400 font-black text-xs block mt-1">Tiền công: ${formatPrice(p.labor_cost)}</span>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
          <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm border border-white/10">
            <span class="text-slate-400 block uppercase font-bold text-[10px]">Chủ Đầu Tư</span>
            <strong class="text-white text-sm">${p.customer_name}</strong>
          </div>
          <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm border border-white/10">
            <span class="text-slate-400 block uppercase font-bold text-[10px]">Số Điện Thoại Liên Hệ</span>
            <a href="tel:${p.customer_phone}" class="text-emerald-400 font-black text-sm hover:underline block font-mono">📞 ${p.customer_phone}</a>
          </div>
          <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm border border-white/10 md:col-span-2">
            <span class="text-slate-400 block uppercase font-bold text-[10px]">Địa Chỉ Lắp Đặt Chính Xác</span>
            <p class="text-slate-200 font-bold mt-0.5">${p.address || (p.district + ", " + p.province_city)}</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs border-t border-white/10 pt-3">
          <div>
            <span class="text-slate-400 block text-[10px]">Cấu hình Pin & Inverter</span>
            <strong class="text-amber-300">${p.capacity_kwp} kWp • ${p.inverter_brand || "Deye"}</strong>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">Kiểu Mái & Yêu Cầu Kỹ Thuật</span>
            <strong class="text-slate-200">${p.roof_type || "Mái tôn"}</strong>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">Trạng Thái Thanh Toán</span>
            <strong class="text-emerald-300">${p.settlement_status || "Chưa thanh toán"}</strong>
          </div>
        </div>
      </div>

      <!-- 2 Khối Thao Tác: 1. Check-in GPS | 2. Cập nhật Tiến Độ -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        
        <!-- Check-in GPS -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex justify-between items-center">
            <h3 class="font-black text-slate-800 text-xs uppercase tracking-wider flex items-center gap-1.5">
              <i class="fas fa-map-marker-alt text-red-500"></i> 1. Check-in GPS Hiện Trường
            </h3>
            ${checkin ? `<span class="px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold text-xs">Đã Check-in</span>` : `<span class="px-2.5 py-0.5 rounded bg-amber-100 text-amber-800 font-bold text-xs">Chưa Check-in</span>`}
          </div>

          ${checkin ? `
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
              <p>⏱️ Thời gian đến: <strong>${new Date(checkin.timestamp).toLocaleString("vi-VN")}</strong></p>
              <p>📍 Tọa độ GPS: <strong class="font-mono text-blue-600">${checkin.gps}</strong></p>
              <p class="text-slate-600 italic">"${checkin.note}"</p>
            </div>
          ` : `
            <div class="space-y-2 text-xs">
              <div class="flex gap-2">
                <input type="text" id="cp-gps-val" placeholder="10.8031, 106.7329" class="flex-1 px-3 py-2 border rounded-xl font-mono text-xs outline-none">
                <button type="button" onclick="window.modContractorPortal.getGPS()" class="px-3 py-2 bg-slate-100 font-bold rounded-xl text-xs hover:bg-slate-200">
                  <i class="fas fa-crosshairs"></i> Lấy GPS
                </button>
              </div>
              <input type="text" id="cp-gps-note" placeholder="Đội 6 thợ đã có mặt lúc 07:30 sáng..." class="w-full px-3 py-2 border rounded-xl text-xs outline-none">
              <button onclick="window.modContractorPortal.submitCheckin(${p.id})" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow transition">
                <i class="fas fa-check-circle"></i> Bấm Check-in Có Mặt Tại Hiện Trường
              </button>
            </div>
          `}
        </div>

        <!-- Cập nhật Tiến Độ % -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center">
              <h3 class="font-black text-slate-800 text-xs uppercase tracking-wider flex items-center gap-1.5">
                <i class="fas fa-sliders-h text-blue-600"></i> 2. Cập Nhật Tiến Độ Thi Công
              </h3>
              <span class="text-blue-600 font-black text-sm" id="cp-disp-prog">${p.progress}%</span>
            </div>
            <p class="text-xs text-slate-500 mt-1">Kéo thanh trượt để báo cáo % khối lượng hoàn thành cho Công Ty.</p>
          </div>
          <input type="range" min="0" max="100" value="${p.progress}" id="cp-range-prog" oninput="document.getElementById('cp-disp-prog').innerText = this.value + '%'" class="w-full accent-blue-600 h-2 bg-slate-200 rounded-lg cursor-pointer">
          <button onclick="window.modContractorPortal.saveProgress(${p.id})" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow transition">
            Lưu % Tiến Độ Thực Tế
          </button>
        </div>

      </div>

      <!-- 3. Bàn Giao Tài Khoản App Inverter -->
      <div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-5 rounded-2xl shadow-md space-y-4">
        <div class="flex items-center gap-2 border-b border-white/10 pb-2.5">
          <i class="fas fa-mobile-alt text-amber-400 text-lg"></i>
          <h3 class="font-bold text-amber-300 uppercase tracking-wider text-xs">3. Bàn Giao Tài Khoản App Inverter Cho Chủ Nhà</h3>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Tên App Giám Sát</label>
            <input type="text" id="cp-app-name" value="${handover.app_name || "Solarman Smart"}" class="w-full bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-white font-bold outline-none">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Tài Khoản (Email / SĐT)</label>
            <input type="text" id="cp-app-acc" value="${handover.app_account || ""}" placeholder="khachhang@gmail.com" class="w-full bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-emerald-300 font-bold outline-none font-mono">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Mật Khẩu Bàn Giao</label>
            <input type="text" id="cp-app-pass" value="${handover.app_password || "Sungo@123"}" class="w-full bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-amber-300 font-bold outline-none font-mono">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Trạng Thái Kết Nối Wifi</label>
            <select id="cp-app-status" class="w-full bg-slate-800 border border-white/20 rounded-xl px-3 py-2 text-emerald-300 font-bold outline-none">
              <option value="HOẠT ĐỘNG MƯỢT MÀ">✅ Online 100% (Mượt mà)</option>
              <option value="CHỜ CẤP MẠNG">⚠️ Đang chờ cài Wifi</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 4. Bộ 6 Góc Ảnh Nghiệm Thu Chuẩn Solar -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <div>
            <h3 class="font-black text-slate-800 text-xs uppercase tracking-wider flex items-center gap-1.5">
              <i class="fas fa-camera text-amber-500"></i> 4. Chụp & Tải Lên 6 Góc Ảnh Nghiệm Thu Tiêu Chuẩn Solar
            </h3>
            <p class="text-xs text-slate-500 mt-0.5">Tiêu chuẩn kỹ thuật bắt buộc để Công Ty và Giám Sát duyệt quyết toán tiền công.</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          ${window.modContractorPortal.renderPhotoUpload("1. Tấm Pin Trên Mái", "cp-img-panels", handover.img_panels)}
          ${window.modContractorPortal.renderPhotoUpload("2. Tủ Điện AC/DC", "cp-img-cabinet", handover.img_cabinet)}
          ${window.modContractorPortal.renderPhotoUpload("3. Biến Tần Inverter", "cp-img-inverter", handover.img_inverter)}
          ${window.modContractorPortal.renderPhotoUpload("4. Pin Lưu Trữ Lithium", "cp-img-battery", handover.img_battery)}
          ${window.modContractorPortal.renderPhotoUpload("5. Đường Dây & Ống Bảo Vệ", "cp-img-wiring", handover.img_wiring)}
          ${window.modContractorPortal.renderPhotoUpload("6. Màn Hình App Đủ Số Liệu", "cp-img-app", handover.img_app)}
        </div>
      </div>

      <!-- 5. TƯ LIỆU & BIÊN BẢN NGHIỆM THU BỔ SUNG (YÊU CẦU CỦA USER) -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <div>
            <h3 class="font-black text-slate-800 text-xs uppercase tracking-wider flex items-center gap-1.5">
              <i class="fas fa-folder-plus text-blue-600"></i> 5. Tư Liệu & Biên Bản Nghiệm Thu Bổ Sung
            </h3>
            <p class="text-xs text-slate-500 mt-0.5">Đính kèm biên bản đo kiểm tiếp địa < 4 Ohm, Voc test, biên bản bàn giao có chữ ký khách hàng, v.v.</p>
          </div>
          <button onclick="window.modContractorPortal.openAddDocModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow transition flex items-center gap-1.5">
            <i class="fas fa-plus"></i> Thêm Tư Liệu Mới
          </button>
        </div>

        <div class="space-y-3">
          ${docs.length === 0 ? `
            <div class="p-6 text-center text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-300">
              <i class="fas fa-file-invoice text-2xl text-slate-300 mb-1 block"></i>
              Chưa có tư liệu nào được tải lên. Hãy bấm nút "Thêm Tư Liệu Mới" để đính kèm biên bản đo kiểm hoặc phiếu bàn giao.
            </div>
          ` : docs.map(d => `
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 bg-blue-100 text-blue-800 font-bold rounded text-[10px]">TƯ LIỆU #${d.id}</span>
                  <strong class="text-slate-900 text-sm">${d.name}</strong>
                </div>
                <p class="text-slate-500">${d.notes || "Không có ghi chú"}</p>
                <span class="text-[10px] text-slate-400">Tải lên lúc: ${new Date(d.uploaded_at).toLocaleString("vi-VN")} bởi ${d.uploaded_by}</span>
              </div>
              ${d.file_url ? `<a href="${d.file_url}" target="_blank" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-sm">Xem File / Ảnh</a>` : ""}
            </div>
          `).join("")}
        </div>
      </div>
    `;
  },

  renderPhotoUpload: (title, id, defaultSrc) => {
    return `
      <div class="border-2 border-dashed border-slate-200 hover:border-amber-500 rounded-2xl p-4 flex flex-col items-center justify-center text-center space-y-2 bg-slate-50 transition">
        <span class="text-xs font-black text-slate-800">${title}</span>
        <img id="prev-${id}" src="${defaultSrc || ""}" class="${defaultSrc ? "" : "hidden"} w-full h-32 object-cover rounded-xl shadow-sm">
        <input type="file" accept="image/*" onchange="window.modContractorPortal.handleUpload(event, 'prev-${id}', 'data-${id}')" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white cursor-pointer">
        <input type="hidden" id="data-${id}" value="${defaultSrc || ""}">
      </div>
    `;
  },

  handleUpload: (e, imgId, inputId) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const b64 = event.target.result;
      const img = document.getElementById(imgId);
      const inp = document.getElementById(inputId);
      if (img) { img.src = b64; img.classList.remove("hidden"); }
      if (inp) inp.value = b64;
    };
    reader.readAsDataURL(file);
  },

  handleDocFileUpload: (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const inp = document.getElementById("doc-url");
      if (inp) inp.value = event.target.result;
    };
    reader.readAsDataURL(file);
  },

  getGPS: () => {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        const inp = document.getElementById("cp-gps-val");
        if (inp) inp.value = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
      });
    }
  },

  submitCheckin: async (pid) => {
    const gps = document.getElementById("cp-gps-val").value.trim() || "10.8031, 106.7329";
    const note = document.getElementById("cp-gps-note").value.trim() || "Đội thợ đã có mặt tại hiện trường.";

    try {
      const res = await fetch(`/api/bidding/projects/${pid}/checkin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ gps, note })
      });
      const json = await res.json();
      if (json.success) {
        alert("🎉 Check-in GPS thành công!");
        await window.modContractorPortal.loadMyProjects();
      }
    } catch(e) { alert("Lỗi: " + e.message); }
  },

  saveProgress: async (pid) => {
    const progress = document.getElementById("cp-range-prog").value;
    try {
      const res = await fetch(`/api/bidding/projects/${pid}/progress`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ progress })
      });
      const json = await res.json();
      if (json.success) {
        alert("🎉 Đã lưu tiến độ " + progress + "%!");
      }
    } catch(e) { alert("Lỗi: " + e.message); }
  },

  saveAllHandover: async () => {
    if (!window.modContractorPortal.currentProject) return;
    const pid = window.modContractorPortal.currentProject.id;
    const payload = {
      app_name: document.getElementById("cp-app-name").value.trim(),
      app_account: document.getElementById("cp-app-acc").value.trim(),
      app_password: document.getElementById("cp-app-pass").value.trim(),
      app_status: document.getElementById("cp-app-status").value,
      img_panels: document.getElementById("data-cp-img-panels").value,
      img_cabinet: document.getElementById("data-cp-img-cabinet").value,
      img_inverter: document.getElementById("data-cp-img-inverter").value,
      img_battery: document.getElementById("data-cp-img-battery").value,
      img_wiring: document.getElementById("data-cp-img-wiring").value,
      img_app: document.getElementById("data-cp-img-app").value,
      progress: document.getElementById("cp-range-prog").value
    };

    try {
      const res = await fetch(`/api/bidding/projects/${pid}/handover`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.success) {
        alert("🎉 Đã lưu toàn bộ 6 ảnh nghiệm thu và thông tin App Inverter thành công!");
      }
    } catch(e) { alert("Lỗi: " + e.message); }
  },

  openAddDocModal: () => {
    document.getElementById("modal-cp-add-doc").classList.remove("hidden");
  },
  closeAddDocModal: () => {
    document.getElementById("modal-cp-add-doc").classList.add("hidden");
  },

  submitAddDoc: async (e) => {
    e.preventDefault();
    if (!window.modContractorPortal.currentProject) return;
    const pid = window.modContractorPortal.currentProject.id;

    const payload = {
      name: document.getElementById("doc-name").value.trim(),
      file_url: document.getElementById("doc-url").value.trim(),
      notes: document.getElementById("doc-notes").value.trim(),
      uploaded_by: "Đội Kỹ Thuật Solar Fast"
    };

    try {
      const res = await fetch(`/api/bidding/projects/${pid}/documents`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.success) {
        alert("✅ Đã thêm tư liệu nghiệm thu thành công!");
        window.modContractorPortal.closeAddDocModal();
        await window.modContractorPortal.loadMyProjects();
      }
    } catch(err) { alert("Lỗi: " + err.message); }
  }
};

setTimeout(() => { window.modContractorPortal.init(); }, 50);
</script>
