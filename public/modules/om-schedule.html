<div class="w-full min-h-full flex flex-col space-y-4 bg-white rounded-2xl shadow-2xs border border-slate-200 p-3.5 sm:p-5 relative pb-28 md:pb-6">
    <!-- Header & Nút hành động -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div>
            <h3 class="font-black text-slate-900 text-base sm:text-lg flex items-center gap-2"><i class="fas fa-tools text-cyan-600"></i> Lịch Bảo Trì & Vệ Sinh (O&M)</h3>
            <p class="text-xs text-slate-500 mt-0.5">Theo dõi kế hoạch rửa pin, kiểm tra định kỳ và sự cố trạm.</p>
        </div>
        <button onclick="window.modOmSchedule.openModal()" class="w-full sm:w-auto bg-cyan-600 hover:bg-cyan-700 active:scale-95 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-2xs flex items-center justify-center gap-1.5 cursor-pointer shrink-0">
            <i class="fas fa-plus"></i> Thêm Lịch Mới
        </button>
    </div>

    <!-- Cụm Thống Kê -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-4">
        <div class="border border-slate-200 rounded-2xl p-3.5 bg-slate-50 shadow-2xs">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Cần Xử Lý</p>
            <p id="stat-pending" class="text-lg sm:text-2xl font-black text-cyan-700">0 Trạm</p>
        </div>
        <div class="border border-slate-200 rounded-2xl p-3.5 bg-slate-50 shadow-2xs">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Đã Hoàn Thành (Tháng)</p>
            <p id="stat-done" class="text-lg sm:text-2xl font-black text-emerald-600">0 Trạm</p>
        </div>
        <div class="border border-slate-200 rounded-2xl p-3.5 bg-slate-50 shadow-2xs">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Báo Cáo Lỗi Từ Khách</p>
            <p id="stat-issue" class="text-lg sm:text-2xl font-black text-red-500">0 Sự cố</p>
        </div>
    </div>

    <!-- Bộ lọc tìm kiếm -->
    <div class="flex flex-col sm:flex-row gap-2">
        <input type="text" id="om-search" placeholder="Tìm tên công trình hoặc địa chỉ..." class="border border-slate-200 rounded-xl px-3 py-2 text-xs w-full sm:w-1/3 outline-none focus:border-cyan-500 font-medium bg-slate-50">
        <select id="om-status-select" onchange="window.modOmSchedule.filterStatus(this.value)" class="border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-cyan-500 font-bold bg-slate-50 text-slate-700">
            <option value="all">Tất cả trạng thái</option>
            <option value="pending">Chờ xử lý</option>
            <option value="done">Đã hoàn thành</option>
        </select>
    </div>

    <!-- 1. Desktop Table View -->
    <div class="hidden md:block overflow-x-auto border border-slate-200 rounded-xl">
        <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-100 text-[10px] uppercase font-black text-slate-600">
                <tr>
                    <th class="p-3 pl-4">Ngày Lên Lịch</th>
                    <th class="p-3">Tên Công Trình</th>
                    <th class="p-3">Khu Vực</th>
                    <th class="p-3">Hạng Mục</th>
                    <th class="p-3 text-center">Trạng Thái</th>
                    <th class="p-3 pr-4 text-center">Thao Tác</th>
                </tr>
            </thead>
            <tbody id="tbl-om" class="divide-y divide-slate-100 text-slate-700">
            </tbody>
        </table>
    </div>

    <!-- 2. Mobile Smart Cards -->
    <div id="tbl-om-mobile" class="md:hidden space-y-2.5 pb-8">
        <!-- Rendered by JS -->
    </div>
</div>
                <!-- Dữ liệu sẽ được render từ JS -->
            </tbody>
        </table>
    </div>

    <!-- ========================================== -->
    <!-- MODAL (POPUP) THÊM LỊCH BẢO TRÌ MỚI        -->
    <!-- ========================================== -->
    <div id="om-modal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative">
            <h3 class="font-bold text-lg mb-4 text-slate-800 border-b pb-2">Tạo Lịch Bảo Trì Mới</h3>
            
            <form id="om-form" onsubmit="window.modOmSchedule.saveSchedule(event)">
                <div class="mb-3">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Ngày hẹn <span class="text-red-500">*</span></label>
                    <input type="date" id="om-date" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:border-cyan-500 focus:outline-none">
                </div>
                
                <div class="mb-3">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Tên công trình/Khách hàng <span class="text-red-500">*</span></label>
                    <input type="text" id="om-name" required placeholder="VD: Biệt thự Chú Hoàng..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:border-cyan-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Loại hệ thống</label>
                        <select id="om-type" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:border-cyan-500 focus:outline-none">
                            <option value="Hybrid (Có lưu trữ)">Hybrid (Có lưu trữ)</option>
                            <option value="Grid-tie (Bám tải)">Grid-tie (Bám tải)</option>
                            <option value="Bảo hành Inverter">Bảo hành Inverter</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Khu vực (Quận/Huyện)</label>
                        <input type="text" id="om-address" placeholder="VD: Q2, TP.HCM" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:border-cyan-500 focus:outline-none">
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Hạng mục cần xử lý <span class="text-red-500">*</span></label>
                    <textarea id="om-task" required rows="2" placeholder="VD: Vệ sinh tấm pin, kiểm tra SPD, đo nội trở..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:border-cyan-500 focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-2">
                    <button type="button" onclick="window.modOmSchedule.closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition-colors">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg text-sm font-semibold transition-colors">Lưu Lịch Lập Tức</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    window.modOmSchedule = {
        data: [],

        // Hiển thị Popup
        openModal: function() {
            document.getElementById('om-form').reset();
            // Đặt mặc định ngày hôm nay cho ô chọn ngày
            document.getElementById('om-date').valueAsDate = new Date();
            document.getElementById('om-modal').classList.remove('hidden');
        },

        // Ẩn Popup
        closeModal: function() {
            document.getElementById('om-modal').classList.add('hidden');
        },

        // API THÊM LỊCH MỚI (POST)
        saveSchedule: async function(e) {
            e.preventDefault(); // Ngăn form load lại trang
            
            const payload = {
                scheduled_date: document.getElementById('om-date').value,
                name: document.getElementById('om-name').value,
                type: document.getElementById('om-type').value,
                address: document.getElementById('om-address').value,
                task: document.getElementById('om-task').value
            };

            try {
                const res = await fetch('/api/om-schedules', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();
                if (result.success) {
                    // Đóng modal và tải lại dữ liệu bảng
                    this.closeModal();
                    this.load(); 
                } else {
                    alert("Có lỗi xảy ra: " + result.error);
                }
            } catch (err) {
                console.error("Lỗi lưu lịch:", err);
                alert("Lỗi kết nối đến máy chủ!");
            }
        },

        // Các hàm có sẵn giữ nguyên
        fetchData: async function() {
            try {
                const res = await fetch('/api/om-schedules');
                const result = await res.json();
                if (result.success) {
                    this.data = result.data;
                    this.renderTable();
                }
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu O&M:", err);
                document.getElementById("tbl-om").innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Lỗi kết nối máy chủ!</td></tr>`;
            }
        },

        fetchStats: async function() {
            try {
                const res = await fetch('/api/om-schedules/stats');
                const result = await res.json();
                if (result.success) {
                    const stats = result.data;
                    const elPending = document.getElementById('stat-pending');
                    const elDone = document.getElementById('stat-done');
                    const elIssue = document.getElementById('stat-issue');
                    
                    if(elPending) elPending.innerText = (stats.pending_count || 0) + ' Trạm';
                    if(elDone) elDone.innerText = (stats.done_this_month || 0) + ' Trạm';
                    if(elIssue) elIssue.innerText = (stats.issue_count || 0) + ' Sự cố';
                }
            } catch (err) { console.error("Lỗi tải thống kê:", err); }
        },

        getStatusBadge: (status) => {
            if (status === 'done') return `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-bold">Hoàn Thành</span>`;
            if (status === 'issue') return `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">Sự Cố</span>`;
            return `<span class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs font-bold">Chờ Xử Lý</span>`;
        },

        renderTable: function(filterText = '') {
            const tbody = document.getElementById("tbl-om");
            const mobContainer = document.getElementById("tbl-om-mobile");
            if (tbody) tbody.innerHTML = "";
            if (mobContainer) mobContainer.innerHTML = "";

            const filteredData = this.data.filter(item => 
                (item.name || '').toLowerCase().includes(filterText.toLowerCase()) || 
                (item.address || '').toLowerCase().includes(filterText.toLowerCase())
            );

            if (filteredData.length === 0) {
                if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-bold">Không có dữ liệu lịch trình.</td></tr>`;
                if (mobContainer) mobContainer.innerHTML = `<div class="p-8 text-center text-slate-400 font-bold text-xs">Không có dữ liệu lịch trình.</div>`;
                return;
            }

            if (tbody) {
                filteredData.forEach(item => {
                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-slate-50 transition-colors";
                    tr.innerHTML = `
                        <td class="p-3 pl-4 font-medium text-slate-700 text-xs">${item.date}</td>
                        <td class="p-3">
                            <div class="font-bold text-cyan-800 text-xs">${item.name}</div>
                            <div class="text-[10px] text-slate-400 mt-0.5"><i class="fas fa-solar-panel"></i> ${item.type}</div>
                        </td>
                        <td class="p-3 text-slate-600 text-xs">${item.address}</td>
                        <td class="p-3 text-slate-700 text-xs font-medium">${item.task}</td>
                        <td class="p-3 text-center">${this.getStatusBadge(item.status)}</td>
                        <td class="p-3 pr-4 text-center">
                            <button onclick="window.modOmSchedule.updateStatus(${item.id}, 'done')" class="text-slate-400 hover:text-emerald-600 mr-2 p-1 cursor-pointer" title="Hoàn thành"><i class="fas fa-check-circle"></i></button>
                            <button onclick="window.modOmSchedule.deleteItem(${item.id})" class="text-slate-400 hover:text-red-500 p-1 cursor-pointer" title="Xóa"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            if (mobContainer) {
                mobContainer.innerHTML = filteredData.map(item => `
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs space-y-2">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-black text-cyan-800">${item.date}</span>
                        ${this.getStatusBadge(item.status)}
                    </div>
                    <div>
                        <h4 class="font-black text-slate-900 text-xs sm:text-sm leading-snug">${item.name}</h4>
                        <p class="text-[11px] text-slate-500 mt-0.5"><i class="fas fa-map-marker-alt text-slate-400 mr-1"></i>${item.address}</p>
                    </div>
                    <div class="text-[11px] bg-slate-50 p-2 rounded-xl border border-slate-100 flex items-center justify-between">
                        <span class="text-slate-600 font-medium">${item.task}</span>
                        <span class="text-slate-400 text-[10px]"><i class="fas fa-solar-panel mr-1"></i>${item.type}</span>
                    </div>
                    <div class="flex items-center justify-end gap-2 pt-1 border-t border-slate-100">
                        <button type="button" onclick="window.modOmSchedule.updateStatus(${item.id}, 'done')" class="bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-xl font-bold text-xs border border-emerald-200 transition flex items-center gap-1 cursor-pointer">
                            <i class="fas fa-check-circle"></i> Hoàn Thành
                        </button>
                        <button type="button" onclick="window.modOmSchedule.deleteItem(${item.id})" class="p-1.5 text-red-500 hover:text-red-700 bg-red-50 rounded-lg text-xs transition cursor-pointer">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>`).join('');
            }
        },

        updateStatus: async function(id, status) {
            if(!confirm("Xác nhận đánh dấu hoàn thành hạng mục này?")) return;
            try {
                await fetch(`/api/om-schedules/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status })
                });
                this.load(); 
            } catch (err) { console.error(err); }
        },

        deleteItem: async function(id) {
            if(!confirm("Bạn có chắc chắn muốn xóa lịch này không?")) return;
            try {
                await fetch(`/api/om-schedules/${id}`, { method: 'DELETE' });
                this.load(); 
            } catch (err) { console.error(err); }
        },

        load: function() {
            this.fetchData();
            this.fetchStats();

            const searchInput = document.getElementById('om-search');
            if(searchInput) {
                const newSearch = searchInput.cloneNode(true);
                searchInput.parentNode.replaceChild(newSearch, searchInput);
                newSearch.addEventListener('input', (e) => {
                    this.renderTable(e.target.value);
                });
            }
        }
    };

    window.modOmSchedule.load();
</script>
