<div class="space-y-6">
    <!-- 1. Tra Cứu & Cập nhật trạng thái bảo hành -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <h3 class="font-bold text-slate-900 text-base mb-4"><i class="fas fa-search text-cyan-600"></i> Tra Cứu & Cập Nhật Bảo Hành</h3>
        <div class="flex gap-4">
            <input type="text" id="search-sn" placeholder="Nhập mã Serial (VD: SN-ZEN-889234)..." class="w-full md:w-1/2 border p-2.5 text-sm font-mono outline-none rounded focus:border-cyan-500">
            <button onclick="window.modWarranty.check()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-6 rounded text-sm transition">Kiểm Tra</button>
        </div>
        <div id="search-result" class="mt-4 hidden"></div>

        <!-- Form ghi nhận lỗi mới -->
        <div id="add-issue-form" class="mt-4 hidden p-4 border border-dashed border-slate-300 rounded bg-slate-50">
            <h4 class="font-bold text-sm text-slate-800 mb-2">Ghi Nhận Lỗi Bảo Hành Mới</h4>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="text" id="issue-detail" placeholder="Chi tiết lỗi (VD: Lỗi module công suất P50A...)" class="border p-2.5 text-sm outline-none rounded w-full focus:border-cyan-500">
                <select id="issue-status" class="border p-2.5 text-sm outline-none rounded w-full focus:border-cyan-500">
                    <option value="Đang tiếp nhận">Đang tiếp nhận</option>
                    <option value="Chờ linh kiện">Chờ linh kiện</option>
                    <option value="Đang sửa chữa">Đang sửa chữa</option>
                    <option value="Đã hoàn thành">Đã hoàn thành</option>
                </select>
                <button onclick="window.modWarranty.addIssue()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded text-sm transition">Cập Nhật Trạng Thái</button>
            </div>
        </div>
    </div>

    <!-- 2. Kích Hoạt Bảo Hành -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <h3 class="font-bold text-slate-900 text-base mb-4"><i class="fas fa-qrcode text-cyan-600"></i> Kích Hoạt Bảo Hành Điện Tử</h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Mã Serial (QR/Barcode)</label>
                <input type="text" id="w-sn" placeholder="Ví dụ: SN-ZEN-889234" class="w-full border p-2.5 text-sm font-mono outline-none rounded focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Thiết Bị Cần Kích Hoạt</label>
                <select id="w-sku" class="w-full border p-2.5 text-sm outline-none rounded focus:border-cyan-500"><option value="">Đang tải...</option></select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Khách Hàng</label>
                <input type="text" id="w-cust" class="w-full border p-2.5 text-sm outline-none rounded focus:border-cyan-500">
            </div>
            <div class="flex items-end">
                <button onclick="window.modWarranty.register()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2.5 rounded text-sm transition">Kích Hoạt</button>
            </div>
        </div>
    </div>

    <!-- 3. Lịch Sử Hệ Sinh Thái -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <h3 class="font-bold text-slate-900 text-base mb-4 flex items-center">
            📋 Hệ Sinh Thái Lịch Sử Bảo Hành 
            <span id="count-result" class="ml-3 px-2 py-1 bg-rose-100 text-rose-700 text-xs rounded-full font-bold">Đang tải...</span>
        </h3>
        
        <!-- BỘ LỌC THÔNG MINH (CRM, Sản phẩm & Trạng thái) -->
        <div class="flex flex-col md:flex-row gap-4 mb-4 bg-slate-50 p-4 rounded border border-slate-200">
            <!-- Ô Tìm kiếm khách hàng (w-1/4) -->
            <div class="w-full md:w-1/4 relative">
                <label class="block text-xs font-semibold text-slate-600 mb-2">🔍 Khách hàng (Tên/SĐT)</label>
                <input type="text" id="search-customer" autocomplete="off" onkeyup="window.modWarranty.handleSearchInput()" placeholder="Tìm tên/số điện thoại..." class="w-full border border-slate-300 p-2 text-sm outline-none rounded focus:border-cyan-500 shadow-sm relative z-20">
                
                <div id="crm-suggest-box" class="absolute z-30 w-full bg-white border border-slate-200 shadow-xl rounded mt-1 hidden max-h-48 overflow-y-auto"></div>
            </div>

            <!-- Ô Lọc theo Sản phẩm (MỚI - w-1/4) -->
            <div class="w-full md:w-1/4">
                <label class="block text-xs font-semibold text-slate-600 mb-2">📦 Lọc theo Sản phẩm</label>
                <select id="filter-product" onchange="window.modWarranty.handleProductFilter()" class="w-full border border-slate-300 p-2 text-sm outline-none rounded focus:border-cyan-500 shadow-sm">
                    <option value="all">Tất cả sản phẩm</option>
                </select>
            </div>
            
            <!-- Các Label Lọc Tình Trạng (w-2/4) -->
            <div class="w-full md:w-2/4">
                <label class="block text-xs font-semibold text-slate-600 mb-2">🏷️ Lọc theo Tình trạng</label>
                <div class="flex flex-wrap gap-2" id="filter-labels">
                    <button onclick="window.modWarranty.setStatus('all_pending')" id="lbl-all_pending" class="px-3 py-1.5 text-xs font-bold rounded-full transition border bg-cyan-600 text-white border-cyan-600 shadow-sm">Đang xử lý</button>
                    <button onclick="window.modWarranty.setStatus('Đang tiếp nhận')" id="lbl-Đang tiếp nhận" class="px-3 py-1.5 text-xs font-bold rounded-full transition border bg-white text-slate-600 border-slate-300 hover:bg-slate-100">Đang tiếp nhận</button>
                    <button onclick="window.modWarranty.setStatus('Chờ linh kiện')" id="lbl-Chờ linh kiện" class="px-3 py-1.5 text-xs font-bold rounded-full transition border bg-white text-slate-600 border-slate-300 hover:bg-slate-100">Chờ linh kiện</button>
                    <button onclick="window.modWarranty.setStatus('Đang sửa chữa')" id="lbl-Đang sửa chữa" class="px-3 py-1.5 text-xs font-bold rounded-full transition border bg-white text-slate-600 border-slate-300 hover:bg-slate-100">Đang sửa chữa</button>
                    <button onclick="window.modWarranty.setStatus('Đã hoàn thành')" id="lbl-Đã hoàn thành" class="px-3 py-1.5 text-xs font-bold rounded-full transition border bg-white text-slate-600 border-slate-300 hover:bg-slate-100">Đã hoàn thành</button>
                    <button onclick="window.modWarranty.setStatus('all')" id="lbl-all" class="px-3 py-1.5 text-xs font-bold rounded-full transition border bg-white text-slate-600 border-slate-300 hover:bg-slate-100">Toàn bộ</button>
                </div>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-slate-100 text-xs uppercase text-slate-600">
                    <tr>
                        <th class="p-3">Mã Serial</th>
                        <th class="p-3">Thiết Bị</th>
                        <th class="p-3">Khách Hàng</th>
                        <th class="p-3 text-center">Ngày Kích Hoạt</th>
                        <th class="p-3 text-center">Số Lần BH</th>
                        <th class="p-3">Chi Tiết Lỗi & Tình Trạng</th>
                    </tr>
                </thead>
                <tbody id="tbl-warranty" class="divide-y"></tbody>
            </table>
        </div>

        <!-- NÚT XEM THÊM -->
        <div id="load-more-container" class="mt-6 text-center hidden">
            <button onclick="window.modWarranty.loadMore()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 px-6 rounded-full text-sm transition">
                Xem thêm 50 mã nữa ⬇️
            </button>
        </div>

    </div>
</div>

<script>
    window.modWarranty = {
        currentSearchSN: null,
        allWarranties: [], 
        currentStatusFilter: 'all_pending', 
        crmCustomers: [],
        displayLimit: 50, 

        load: async () => {
            const pRes = await fetch('/api/products'); 
            const pData = await pRes.json();
            if(pData.success) {
                // Đổ dữ liệu vào cả dropdown Kích hoạt và dropdown Lọc
                const productOptions = pData.data.map(p => `<option value="${p.sku}">${p.product_name}</option>`).join('');
                document.getElementById('w-sku').innerHTML = productOptions;
                document.getElementById('filter-product').innerHTML = '<option value="all">Tất cả sản phẩm</option>' + productOptions;
            }
            
            const wRes = await fetch('/api/warranties'); 
            const wData = await wRes.json();
            if(wData.success) {
                window.modWarranty.allWarranties = wData.data; 
                
                const uniqueCust = [...new Set(wData.data.map(w => w.customer_name).filter(Boolean))];
                window.modWarranty.crmCustomers = uniqueCust;

                window.modWarranty.renderTable();
            }

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#search-customer') && !e.target.closest('#crm-suggest-box')) {
                    document.getElementById('crm-suggest-box').classList.add('hidden');
                }
            });
        },

        loadMore: () => {
            window.modWarranty.displayLimit += 50; 
            window.modWarranty.renderTable();      
        },

        // Xử lý khi chọn dropdown Sản phẩm
        handleProductFilter: () => {
            window.modWarranty.displayLimit = 50; // Reset số lượng hiển thị
            window.modWarranty.renderTable();
        },

        handleSearchInput: () => {
            const input = document.getElementById('search-customer').value.trim().toLowerCase();
            const suggestBox = document.getElementById('crm-suggest-box');
            
            window.modWarranty.displayLimit = 50; 
            window.modWarranty.renderTable(); 

            if (!input) {
                suggestBox.classList.add('hidden');
                return;
            }

            const matches = window.modWarranty.crmCustomers.filter(c => c.toLowerCase().includes(input));
            
            if (matches.length > 0) {
                suggestBox.innerHTML = matches.map(c => 
                    `<div onclick="window.modWarranty.selectCustomer('${c}')" class="p-2.5 text-sm hover:bg-cyan-50 cursor-pointer border-b border-slate-100 last:border-0 font-medium text-slate-700 transition">
                        ${c}
                    </div>`
                ).join('');
                suggestBox.classList.remove('hidden');
            } else {
                suggestBox.classList.add('hidden');
            }
        },

        selectCustomer: (customerName) => {
            document.getElementById('search-customer').value = customerName;
            document.getElementById('crm-suggest-box').classList.add('hidden'); 
            window.modWarranty.displayLimit = 50; 
            window.modWarranty.renderTable(); 
        },

        setStatus: (status) => {
            window.modWarranty.currentStatusFilter = status;
            window.modWarranty.displayLimit = 50; 
            
            const buttons = document.querySelectorAll('#filter-labels button');
            buttons.forEach(btn => {
                btn.className = "px-3 py-1.5 text-xs font-bold rounded-full transition border bg-white text-slate-600 border-slate-300 hover:bg-slate-100";
            });

            const activeBtn = document.getElementById('lbl-' + status);
            if(activeBtn) {
                activeBtn.className = "px-3 py-1.5 text-xs font-bold rounded-full transition border bg-cyan-600 text-white border-cyan-600 shadow-sm";
            }

            window.modWarranty.renderTable();
        },

        renderTable: () => {
            const statusFilter = window.modWarranty.currentStatusFilter;
            const keyword = document.getElementById('search-customer').value.trim().toLowerCase();
            const productFilter = document.getElementById('filter-product').value;

            // 1. Lọc kết hợp (Tên khách + Tình trạng + Tên sản phẩm)
            let filteredWarranties = window.modWarranty.allWarranties.filter(w => {
                // ĐK Khách hàng
                const custInfo = (w.customer_name || '').toLowerCase();
                const matchKeyword = (keyword === '') || custInfo.includes(keyword);

                // ĐK Sản phẩm
                const matchProduct = (productFilter === 'all') || (w.sku === productFilter);

                // ĐK Tình trạng
                let matchStatus = false;
                if (statusFilter === 'all') {
                    matchStatus = true;
                } else if (statusFilter === 'all_pending') {
                    matchStatus = (w.issues || []).some(i => i.status !== 'Đã hoàn thành');
                } else {
                    matchStatus = (w.issues || []).some(i => i.status === statusFilter);
                }

                return matchKeyword && matchStatus && matchProduct;
            });

            // Cập nhật bộ đếm hiển thị tỷ lệ
            document.getElementById('count-result').innerText = `Tổng: ${filteredWarranties.length} máy`;

            const btnContainer = document.getElementById('load-more-container');
            if (filteredWarranties.length > window.modWarranty.displayLimit) {
                btnContainer.classList.remove('hidden');
            } else {
                btnContainer.classList.add('hidden');
            }

            const itemsToRender = filteredWarranties.slice(0, window.modWarranty.displayLimit);

            document.getElementById('tbl-warranty').innerHTML = itemsToRender.map(w => {
                let issuesToDisplay = w.issues || [];
                if (statusFilter === 'all_pending') {
                    issuesToDisplay = issuesToDisplay.filter(i => i.status !== 'Đã hoàn thành');
                } else if (statusFilter !== 'all') {
                    issuesToDisplay = issuesToDisplay.filter(i => i.status === statusFilter);
                }

                const issueHtml = issuesToDisplay.map(i => `<div class="mb-1 border-b border-slate-100 pb-1 last:border-0">- ${i.detail} <span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded ml-1 font-semibold">${i.status}</span></div>`).join('');

                return `
                <tr class="hover:bg-slate-50">
                    <td class="p-3 font-mono font-bold text-cyan-700">${w.serial_number}</td>
                    <td class="p-3 font-semibold">${w.product_name} <br><span class="text-[10px] text-slate-400 bg-slate-100 px-1 rounded">${w.sku}</span></td>
                    <td class="p-3 font-medium">${w.customer_name}</td>
                    <td class="p-3 text-center text-slate-500">${new Date(w.activated_at).toLocaleDateString('vi-VN')}</td>
                    <td class="p-3 text-center font-bold text-rose-600">${issuesToDisplay.length}</td>
                    <td class="p-3 text-xs text-slate-700 whitespace-normal min-w-[250px]">${issueHtml || '<span class="text-slate-400 italic">Không có dữ liệu</span>'}</td>
                </tr>
            `}).join('');
        },

        register: async () => {
            const payload = { 
                serial_number: document.getElementById('w-sn').value.trim(), 
                sku: document.getElementById('w-sku').value, 
                customer_name: document.getElementById('w-cust').value.trim()
            };
            if (!payload.serial_number || !payload.customer_name) return alert("⚠️ Nhập đủ Mã Serial và Tên Khách hàng!");
            
            const res = await fetch('/api/warranties', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await res.json();
            if (data.success) { 
                alert("✅ Kích hoạt thiết bị thành công!"); 
                document.getElementById('w-sn').value = ''; 
                document.getElementById('w-cust').value = ''; 
                window.modWarranty.load(); 
            } else alert("❌ Lỗi: " + data.error);
        },

        check: async () => {
            const sn = document.getElementById('search-sn').value.trim();
            if (!sn) return alert("Vui lòng nhập mã Serial!");
            
            window.modWarranty.currentSearchSN = sn;
            const res = await fetch(`/api/warranties/${sn}`);
            const data = await res.json();
            const resDiv = document.getElementById('search-result');
            const formDiv = document.getElementById('add-issue-form');
            
            resDiv.classList.remove('hidden');

            if (data.success && data.found) {
                const w = data.data;
                const actDate = new Date(w.activated_at);
                const issues = w.issues || [];
                
                formDiv.classList.remove('hidden');
                
                const historyHtml = issues.length > 0 ? `
                    <div class="mt-4 p-3 bg-white border border-slate-200 rounded">
                        <p class="font-bold text-xs text-slate-800 mb-2">Lịch Sử & Cập Nhật Lỗi:</p>
                        ${issues.map(i => `
                            <div class="flex items-center gap-2 text-xs mb-2 pb-2 border-b border-slate-100 last:border-0 last:mb-0 last:pb-0">
                                <input type="text" id="edit-detail-${i.id}" value="${i.detail}" class="border border-slate-300 focus:border-cyan-500 p-1.5 rounded flex-1 outline-none">
                                <select id="edit-status-${i.id}" class="border border-slate-300 focus:border-cyan-500 p-1.5 rounded outline-none w-36">
                                    <option value="Đang tiếp nhận" ${i.status === 'Đang tiếp nhận' ? 'selected' : ''}>Đang tiếp nhận</option>
                                    <option value="Chờ linh kiện" ${i.status === 'Chờ linh kiện' ? 'selected' : ''}>Chờ linh kiện</option>
                                    <option value="Đang sửa chữa" ${i.status === 'Đang sửa chữa' ? 'selected' : ''}>Đang sửa chữa</option>
                                    <option value="Đã hoàn thành" ${i.status === 'Đã hoàn thành' ? 'selected' : ''}>Đã hoàn thành</option>
                                </select>
                                <button onclick="window.modWarranty.updateIssue(${i.id})" class="bg-cyan-600 hover:bg-cyan-700 text-white px-3 py-1.5 rounded font-bold transition">Lưu</button>
                            </div>
                        `).join('')}
                    </div>
                ` : '';

                resDiv.innerHTML = `
                    <div class="p-4 border rounded bg-slate-50 border-slate-200">
                        <p class="font-bold text-lg text-cyan-700">✅ TÌM THẤY THÔNG TIN THIẾT BỊ</p>
                        <div class="grid grid-cols-2 gap-2 mt-3 text-sm text-slate-700">
                            <div><b>Thiết bị:</b> ${w.product_name} (${w.sku})</div>
                            <div><b>Khách hàng:</b> ${w.customer_name}</div>
                            <div><b>Ngày kích hoạt:</b> ${actDate.toLocaleDateString('vi-VN')}</div>
                            <div><b>Số lần bảo hành:</b> <span class="text-rose-600 font-bold">${issues.length} lần</span></div>
                        </div>
                        ${historyHtml}
                    </div>
                `;
            } else {
                formDiv.classList.add('hidden');
                resDiv.innerHTML = `<div class="p-4 bg-amber-50 border border-amber-200 rounded text-amber-800 font-medium">⚠️ Không tìm thấy thông tin trên hệ thống cho mã Serial này.</div>`;
            }
        },

        addIssue: async () => {
            const sn = window.modWarranty.currentSearchSN;
            const detail = document.getElementById('issue-detail').value.trim();
            const status = document.getElementById('issue-status').value;
            
            if(!detail) return alert("Vui lòng nhập chi tiết lỗi phát sinh!");
            
            try {
                const res = await fetch(`/api/warranties/${sn}/issues`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ detail, status }) 
                });
                
                const data = await res.json();
                if(data.success) {
                    alert("✅ Đã tạo mới lỗi thành công!");
                    document.getElementById('issue-detail').value = '';
                    window.modWarranty.check(); 
                    window.modWarranty.load();  
                } else {
                    alert("❌ Lỗi: " + data.error);
                }
            } catch (error) {
                alert("❌ Lỗi kết nối tới máy chủ.");
            }
        },

        updateIssue: async (id) => {
            const detail = document.getElementById(`edit-detail-${id}`).value.trim();
            const status = document.getElementById(`edit-status-${id}`).value;

            if(!detail) return alert("Vui lòng không để trống chi tiết lỗi!");

            try {
                const res = await fetch(`/api/warranties/issues/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ detail, status })
                });

                const data = await res.json();
                if(data.success) {
                    alert("✅ Đã cập nhật trạng thái lỗi thành công!");
                    window.modWarranty.check(); 
                    window.modWarranty.load();  
                } else {
                    alert("❌ Lỗi: " + data.error);
                }
            } catch (error) {
                alert("❌ Lỗi kết nối tới máy chủ.");
            }
        }
    };
    
    window.modWarranty.load();
</script>
