<div class="h-full flex flex-col bg-slate-50 relative overflow-hidden text-sm">
    <div class="flex-1 overflow-y-auto p-6 w-full h-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-[22px] font-bold text-slate-800">Tổng Quan Kho Hàng (WMS)</h2>
            <div class="text-xs font-bold text-slate-500 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm"><i class="fas fa-user-shield text-emerald-500 mr-1"></i> Role: THỦ KHO</div>
        </div>

        <!-- 4 CHỈ SỐ MÙ GIÁ -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4 border-l-4 border-l-blue-500">
                <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-xl"><i class="fas fa-boxes"></i></div>
                <div><p class="text-[10px] font-black text-slate-400 uppercase">Tổng mã SKU</p><h3 class="text-2xl font-black text-slate-800" id="wms-total-sku">0</h3></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4 border-l-4 border-l-emerald-500">
                <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center text-xl"><i class="fas fa-layer-group"></i></div>
                <div><p class="text-[10px] font-black text-slate-400 uppercase">Tổng tồn hệ thống</p><h3 class="text-2xl font-black text-slate-800" id="wms-total-stock">0</h3></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4 border-l-4 border-l-red-500">
                <div class="w-12 h-12 rounded-full bg-red-50 text-red-500 flex items-center justify-center text-xl"><i class="fas fa-exclamation-triangle"></i></div>
                <div><p class="text-[10px] font-black text-slate-400 uppercase">Cảnh báo hết hàng</p><h3 class="text-2xl font-black text-red-600" id="wms-low-stock">0</h3></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4 border-l-4 border-l-orange-500">
                <div class="w-12 h-12 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center text-xl"><i class="fas fa-truck-loading"></i></div>
                <div><p class="text-[10px] font-black text-slate-400 uppercase">Chờ đóng gói (Đơn)</p><h3 class="text-2xl font-black text-slate-800" id="wms-pending-out">0</h3></div>
            </div>
        </div>

        <!-- BẢNG TỒN KHO THỰC TẾ (ĐA KHO) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 text-[13px]"><i class="fas fa-list text-slate-500 mr-2"></i>Bản Đồ Tồn Kho (Đa Kho)</h3>
                <div class="relative w-64">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-search"></i></span>
                    <input type="text" id="wms-search" oninput="window.modWmsDash.renderTable()" placeholder="Tìm Tên, SKU..." class="w-full border border-slate-200 rounded-lg py-1.5 pl-10 pr-3 text-xs outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="overflow-x-auto max-h-[500px]">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="bg-[#f8f9fa] text-slate-500 text-[10px] uppercase font-bold sticky top-0 shadow-sm z-10">
                        <tr id="wms-thead-row">
                            <!-- JS sẽ tự động generate các cột kho vào đây -->
                            <th class="p-3">Mã SKU</th>
                            <th class="p-3">Tên Hàng Hóa</th>
                            <th class="p-3 text-center bg-slate-100">Tổng Tồn</th>
                            <!-- Các cột kho sẽ chèn ở đây -->
                            <th class="p-3 text-center">Đang Giữ (Ảo)</th>
                            <th class="p-3 text-center">Có thể Xuất</th>
                            <th class="p-3">Vị trí</th>
                        </tr>
                    </thead>
                    <tbody id="wms-tbody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
window.modWmsDash = {
    products: [],
    warehouses: [], // Lưu trữ danh sách kho cấu hình

    load: async () => {
        try {
            // 1. Fetch danh sách kho từ Settings
            const setRes = await fetch('/api/settings?t=' + Date.now());
            const setJson = await setRes.json();
            if(setJson.success && setJson.data && setJson.data.warehouses) {
                window.modWmsDash.warehouses = setJson.data.warehouses;
            }

            // 2. Fetch danh sách sản phẩm
            const res = await fetch('/api/products?t=' + Date.now());
            const data = await res.json();
            if(data.success) {
                window.modWmsDash.products = data.data || [];
                window.modWmsDash.updateMetrics();
                window.modWmsDash.renderTable();
            }
        } catch(e) {
            console.error("Lỗi tải dữ liệu WMS", e);
        }
    },

    updateMetrics: () => {
        const ps = window.modWmsDash.products;
        document.getElementById('wms-total-sku').innerText = ps.length;
        let totalStock = 0;
        let lowStock = 0;
        ps.forEach(p => {
            const sq = parseFloat(p.stock_qty) || 0;
            totalStock += sq;
            if (sq <= 5) lowStock++; // Cảnh báo tổng tồn dưới 5 cái
        });
        document.getElementById('wms-total-stock').innerText = new Intl.NumberFormat('vi-VN').format(totalStock);
        document.getElementById('wms-low-stock').innerText = lowStock;
    },

    renderTable: () => {
        // 1. Khởi tạo và render tiêu đề bảng (Thêm cột động theo số lượng kho)
        const theadRow = document.getElementById('wms-thead-row');
        let whHeaders = window.modWmsDash.warehouses.map(wh => `
            <th class="p-3 text-center text-blue-600 border-l border-slate-200 bg-blue-50/30" title="${wh.name}">${wh.code}</th>
        `).join('');

        if (window.modWmsDash.warehouses.length === 0) {
            whHeaders = `<th class="p-3 text-center text-red-500">Chưa cài đặt kho</th>`;
        }

        theadRow.innerHTML = `
            <th class="p-3">Mã SKU</th>
            <th class="p-3">Tên Hàng Hóa</th>
            <th class="p-3 text-center bg-slate-100 border-x border-slate-200">Tổng Tồn</th>
            ${whHeaders}
            <th class="p-3 text-center border-l border-slate-200">Đang Giữ (Ảo)</th>
            <th class="p-3 text-center">Có thể Xuất</th>
            <th class="p-3">Vị trí</th>
        `;

        // 2. Render nội dung
        const term = document.getElementById('wms-search').value.toLowerCase().trim();
        let filtered = window.modWmsDash.products;
        
        if(term) {
            filtered = filtered.filter(p => (p.product_name||'').toLowerCase().includes(term) || (p.sku||'').toLowerCase().includes(term));
        }
        
        const tbody = document.getElementById('wms-tbody');
        if(filtered.length === 0) { 
            tbody.innerHTML = `<tr><td colspan="${6 + window.modWmsDash.warehouses.length}" class="p-6 text-center text-slate-400">Không có dữ liệu</td></tr>`; 
            return; 
        }

        tbody.innerHTML = filtered.map(p => {
            const sq = parseFloat(p.stock_qty) || 0;
            const vq = parseFloat(p.virtual_stock) || 0;
            const avail = sq - vq;
            
            let availClass = avail > 5 ? 'text-emerald-600' : (avail > 0 ? 'text-orange-500' : 'text-red-500');

            // Render dữ liệu tồn từng kho
            let whCells = window.modWmsDash.warehouses.map(wh => {
                let whStock = 0;
                if(p.stocks && typeof p.stocks === 'object' && p.stocks[wh.id] !== undefined) {
                    whStock = p.stocks[wh.id];
                } else if (!p.stocks && window.modWmsDash.warehouses.length > 0 && wh.id === window.modWmsDash.warehouses[0].id) {
                    // Tương thích ngược: Nếu sản phẩm cũ chưa chia kho, dồn hết số lượng hiển thị tạm vào kho đầu tiên
                    whStock = p.stock_qty || 0;
                }
                
                // Highlight nếu kho hết hàng
                let stockColorClass = whStock > 0 ? 'text-blue-700 font-bold' : 'text-slate-300 font-normal';

                return `<td class="p-3 text-center border-l border-slate-100 ${stockColorClass}">${whStock}</td>`;
            }).join('');

            if (window.modWmsDash.warehouses.length === 0) {
                whCells = `<td class="p-3 text-center text-slate-400">-</td>`;
            }

            return `
            <tr class="hover:bg-slate-50 transition-colors">
                <td class="p-3 font-mono text-xs text-slate-500 font-bold">${p.sku || 'N/A'}</td>
                <td class="p-3 font-bold text-slate-800 text-xs">${p.product_name}</td>
                <td class="p-3 text-center font-black text-slate-700 bg-slate-50 border-x border-slate-100">${sq}</td>
                
                ${whCells} <!-- Các cột kho được chèn vào đây -->
                
                <td class="p-3 text-center font-bold text-slate-400 border-l border-slate-100">${vq}</td>
                <td class="p-3 text-center font-black ${availClass}">${avail}</td>
                <td class="p-3 text-xs text-blue-600 font-bold">${p.bin_location || 'A1-00'}</td>
            </tr>`;
        }).join('');
    }
};

// Kích hoạt load dữ liệu
window.modWmsDash.load();
</script>
