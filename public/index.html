<!DOCTYPE html>
<html lang="vi">
<head>

    <!-- UNIFIED RBAC SYSTEM (5 LEVELS) -->
    <script>
    (function() {
        // Cấu hình từ khóa nhận diện Menu cho từng Quyền
        const rolePermissions = {
            'ADMIN': ['all'],
            'SALES': ['bán hàng', 'crm', 'khách hàng', 'đơn hàng', 'báo giá', 'boq', 'hoa hồng', 'sales-commissions', 'sàn công trình', 'đấu thầu'],
            'TECH': ['kỹ thuật', 'thi công', 'dự án', 'bảo trì', 'o&m', 'serial', 'sàn công trình', 'đấu thầu'],
            'INVENTORY': ['thu mua', 'vật tư', 'tồn kho', 'nhập kho', 'nhà cung cấp', 'sơ đồ', 'sàn công trình'],
            'WAREHOUSE': ['kho vận', 'đóng gói', 'lệnh xuất', 'giao hàng'],
            'KE_TOAN': ['kế toán', 'sổ quỹ', 'két sắt', 'thuế', 'hóa đơn', 'hợp đồng', 'vat', 'nhân sự', 'tiền lương', 'bảo hiểm', 'hoa hồng', 'lãi vay', 'khoản vay', 'nguồn vốn', 'cổ đông', 'accounting-vault', 'accounting-cashbook', 'accounting-cash', 'accounting-vat', 'accounting-tax', 'hr-employees', 'sales-commissions', 'payroll-manager', 'finance-loans', 'finance-capital'],
            'NHA_THAU_THI_CONG': ['dự án', 'nghiệm thu', 'tư liệu', 'hồ sơ năng lực', 'contractor-portal', 'contractor-my-profile'],
            'NHA_THAU_GIAM_SAT': ['dự án', 'nghiệm thu', 'tư liệu', 'hồ sơ năng lực', 'contractor-portal', 'contractor-my-profile'],
            'NHA_CUNG_CAP': ['dự án', 'nghiệm thu', 'tư liệu', 'hồ sơ năng lực', 'contractor-portal', 'contractor-my-profile']
        };

        // Cấu hình màn hình khởi động tự động cho từng Quyền
        const defaultModules = {
            'ADMIN': 'dashboard',
            'SALES': 'crm-list',
            'TECH': 'project-list',
            'INVENTORY': 'inventory-map',
            'WAREHOUSE': 'warehouse-out',
            'KE_TOAN': 'accounting-vault',
            'NHA_THAU_THI_CONG': 'contractor-portal',
            'NHA_THAU_GIAM_SAT': 'contractor-portal',
            'NHA_CUNG_CAP': 'contractor-portal'
        };

        function applyRBAC() {
            try {
                const uStr = localStorage.getItem('user');
                if (!uStr) return;
                const user = JSON.parse(uStr);
                const role = user.role || 'GUEST';
                const perms = rolePermissions[role] || [];
                
                // Sếp tổng (ADMIN) thì thấy sạch sẽ mọi thứ
                if (perms.includes('all')) {
                    document.querySelectorAll('.hidden[data-role], li, .menu-item').forEach(el => {
                        if (el.style.display === 'none') el.style.display = '';
                    });
                    return;
                }

                // Các nhân viên khác: Lọc menu gắt gao
                document.querySelectorAll('a, li, button, .menu-item, .nav-item').forEach(el => {
                    const txt = (el.innerText || '').toLowerCase();
                    const onclick = (el.getAttribute('onclick') || '').toLowerCase();
                    
                    // Chỉ xét những menu có chức năng chuyển trang
                    if (onclick.includes('loadmodule') || el.hasAttribute('data-module')) {
                        let isAllowed = false;
                        for (let p of perms) {
                            if (txt.includes(p) || onclick.includes(p)) {
                                isAllowed = true; 
                                break;
                            }
                        }

                        if (isAllowed) {
                            el.classList.remove('hidden');
                            el.style.display = '';
                            if(el.parentElement && el.parentElement.tagName !== 'BODY') {
                                el.parentElement.style.display = '';
                                el.parentElement.classList.remove('hidden');
                            }
                        } else {
                            if (txt.length > 2) { // Giấu sạch những cái không thuộc thẩm quyền
                                el.style.display = 'none';
                                el.classList.add('hidden');
                            }
                        }
                    }
                });

                // Auto-Focus: Vừa login xong là ném thẳng vào đúng nơi làm việc
                if (typeof loadModule === 'function' && document.getElementById('main-content').innerHTML.trim().length < 500) {
                    const defMod = defaultModules[role];
                    if(defMod) loadModule(defMod);
                }

            } catch(e) {}
        }

        // Kích hoạt tường lửa Menu
        window.addEventListener('DOMContentLoaded', () => {
            setInterval(applyRBAC, 400); // Quét bảo vệ mỗi 0.4s
            applyRBAC();
        });
    })();
    </script>
    <!-- END UNIFIED RBAC SYSTEM -->

    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Đăng Nhập - SUNGO ERP</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px)); }
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top, 0px)); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 min-h-screen flex items-center justify-center font-sans p-4 pt-safe pb-safe">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-8 transform transition-all border border-slate-100">
        <div class="text-center mb-6 sm:mb-8">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-600 items-center justify-center text-slate-900 shadow-lg shadow-amber-500/20 mb-3">
                <i class="fas fa-solar-panel text-2xl"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-amber-500 tracking-widest">SUNGO<span class="text-slate-900">ERP</span></h1>
            <p class="text-slate-500 text-xs sm:text-sm font-semibold mt-1">Hệ thống Quản trị Năng lượng Thông minh</p>
        </div>
        
        <!-- BÊN TRONG FILE index.html (Phần nút bấm & Script) -->
        <!-- FORM ĐĂNG NHẬP THẬT -->
        <div class="space-y-4">
            <!-- Khu vực hiển thị lỗi -->
            <div id="login-error" class="hidden bg-red-50 text-red-600 p-3.5 rounded-xl text-xs sm:text-sm font-bold text-center border border-red-200 shadow-xs"></div>
            
            <div>
                <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1.5 flex items-center gap-1.5">
                    <i class="fas fa-user text-amber-500 text-xs"></i> Tên đăng nhập (Username)
                </label>
                <input type="text" id="username" autocomplete="username" autocapitalize="none" class="w-full border border-slate-300 rounded-xl p-3.5 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200 text-base sm:text-sm font-bold bg-slate-50 text-slate-900 transition" placeholder="Nhập tài khoản của bạn...">
            </div>
            
            <div>
                <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1.5 flex items-center gap-1.5">
                    <i class="fas fa-lock text-amber-500 text-xs"></i> Mật khẩu (Password)
                </label>
                <input type="password" id="password" autocomplete="current-password" class="w-full border border-slate-300 rounded-xl p-3.5 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200 text-base sm:text-sm font-bold bg-slate-50 text-slate-900 transition" placeholder="••••••••">
            </div>
            
            <button onclick="performLogin()" id="btn-login" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 active:scale-[0.99] text-slate-900 font-black py-4 rounded-xl mt-4 shadow-lg shadow-amber-500/25 transition uppercase tracking-wider text-sm flex items-center justify-center gap-2 cursor-pointer">
                <span>Đăng Nhập Vào Hệ Thống</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div> <!-- Kết thúc thẻ div form card -->

    <script>
        // Xóa phiên đăng nhập cũ mỗi khi ra ngoài màn hình này
        localStorage.removeItem('sungo_user');
        localStorage.removeItem('sungo_token');

        async function performLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const err = document.getElementById('login-error');

            // Kiểm tra rỗng
            if(!user || !pass) {
                err.innerText = "⚠️ Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!";
                err.classList.remove('hidden');
                return;
            }

            // Hiệu ứng đang xử lý
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> ĐANG KIỂM TRA...';
            btn.classList.add('opacity-50', 'pointer-events-none');
            err.classList.add('hidden');

            try {
                // Gọi API backend chúng ta vừa tạo
                const res = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await res.json();

                if(data.success) {
                    const u = data.user;
                    // Lưu JWT token an toàn
                    if (data.token) {
                        localStorage.setItem('sungo_token', data.token);
                    }
                    // Đóng gói data để lưu vào localStorage đúng chuẩn hệ thống đang dùng
                    const sessionData = {
                        id: u.id,
                        role: u.role,
                        name: u.full_name,
                        avatar: '👤',
                        empId: u.emp_id,
                        custom_modules: u.custom_modules || [],
                        token: data.token || ''
                    };
                    localStorage.setItem('sungo_user', JSON.stringify(sessionData));
                    
                    // Thành công -> Bắn thẳng vào Dashboard
                    window.location.href = '/dashboard.html';
                } else {
                    // Trả về lỗi sai pass từ server
                    err.innerText = "❌ " + data.error;
                    err.classList.remove('hidden');
                }
            } catch(e) {
                err.innerText = "⚠️ Lỗi không thể kết nối đến Máy chủ (Server)!";
                err.classList.remove('hidden');
            } finally {
                // Trả lại trạng thái nút
                btn.innerHTML = 'Đăng Nhập Vào Hệ Thống';
                btn.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        // Bắt sự kiện nhấn phím Enter để login cho nhanh
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performLogin();
            }
        });
    </script>
</body>
</html>
