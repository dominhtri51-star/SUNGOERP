databases:
  - name: sungo-postgres
    databaseName: solar_rms_cloud
    user: solar_admin
    plan: free

services:
  - type: web
    name: sungo-erp
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sungo-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
